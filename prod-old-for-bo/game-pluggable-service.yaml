apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: game-pluggable-service
    app.kubernetes.io/instance: tgs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: game-pluggable-service
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: game-pluggable-service-0.1.0
    tgs.game.kind: pluggable
    tgs.kind: game
    tgs.pluggable.kind: service
  name: game-pluggable-service
  namespace: prod-old
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: game-pluggable-service
      app.kubernetes.io/instance: tgs
      app.kubernetes.io/name: game-pluggable-service
      tgs.game.kind: pluggable
      tgs.kind: game
      tgs.pluggable.kind: service
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2024-04-23T00:15:03Z"
        prometheus.io/path: /metrics
        prometheus.io/port: "8889"
        prometheus.io/scrape: "true"
      creationTimestamp: null
      labels:
        app: game-pluggable-service
        app.kubernetes.io/instance: tgs
        app.kubernetes.io/name: game-pluggable-service
        tgs.game.kind: pluggable
        tgs.kind: game
        tgs.pluggable.kind: service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - game-pluggable-service
            topologyKey: kubernetes.io/hostname
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: Game-Pluggable-Service(prod)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: ConnectionStrings__Tgs
          valueFrom:
            secretKeyRef:
              key: tgs
              name: tgs-connections
        - name: ConnectionStrings__Nats
          valueFrom:
            secretKeyRef:
              key: nats
              name: tgs-connections
        - name: ConnectionStrings__Redis
          valueFrom:
            secretKeyRef:
              key: redis
              name: tgs-connections
        - name: STAKATER_TGS_CONNECTIONS_SECRET
          value: 49e16a9db0eb035ef5213c2abb85424fc56e1c7a
        - name: STAKATER_CONFIGMAP_GAME_PLUGGABLE_SERVICE_CONFIGMAP
          value: 6ac45082f4d10dd960de0582e8fb8800ff3e03b1
        image: pgtgs/game-pluggable-service:202404180929.94
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 60
          successThreshold: 1
          timeoutSeconds: 1
        name: game-pluggable-service
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 512Mi
        securityContext: {}
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.Production.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub
      nodeSelector:
        dedicated: game
      restartPolicy: Always
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: game
      volumes:
      - configMap:
          defaultMode: 420
          name: configmap-game-pluggable-service
        name: appsettings
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: game-pluggable-service
    app.kubernetes.io/instance: tgs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: game-pluggable-service
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: game-pluggable-service-0.1.0
    tgs.game.kind: pluggable
    tgs.kind: game
    tgs.pluggable.kind: service
    velero.io/backup-name: svc-1115
    velero.io/restore-name: svc
  name: game-pluggable-service
  namespace: prod-old
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: game-pluggable-service
    app.kubernetes.io/instance: tgs
    app.kubernetes.io/name: game-pluggable-service
    tgs.game.kind: pluggable
    tgs.kind: game
    tgs.pluggable.kind: service
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: v1
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning"
        }
      },
      "Pluggable": {
        "GameProvidersClientBaseUrl": "http://game-gameproviders/",
        "CashServiceClientBaseUrl": "http://cashservice-api/",
        "GameFundTransferClientBaseUrl": "dns:///game-gamefundtransfer:9090/",
        "GameCurrencyClientBaseUrl": "http://game-gamecurrency/",
        "GameRoundsClientBaseUrl": "http://game-gamerounds"
      }
    }
  otel-collector-config.yaml: "receivers:\n  otlp:\n    protocols:\n      grpc:\n\nprocessors:\n
    \ batch:\n\nexporters:\n  otlp:\n    endpoint: \"$NODE_IP:4317\"\n    tls:\n      insecure:
    true\n  prometheus:\n    endpoint: \"0.0.0.0:8889\"\n    namespace: \"tgs\"\n\nextensions:\n
    \ health_check:\n    endpoint: 0.0.0.0:13133\n\nservice:\n  extensions: [health_check]\n
    \ pipelines:\n    traces: \n      receivers: [otlp]\n      processors:\n        -
    batch\n      exporters: [otlp]\n    metrics:\n      receivers: [otlp]\n      exporters:
    [prometheus]\n"
kind: ConfigMap
metadata:
  labels:
    app: game-pluggable-service
    app.kubernetes.io/instance: tgs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: game-pluggable-service
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: game-pluggable-service-0.1.0
    tgs.game.kind: pluggable
    tgs.kind: game
    tgs.pluggable.kind: service
  name: configmap-game-pluggable-service
  namespace: prod-old
