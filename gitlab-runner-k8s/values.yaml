gitlabUrl: https://gitlab.com/
runnerRegistrationToken: "$token"
replicas: 3
concurrency: 3
rbac:
  create: true
  generatedServiceAccountName: "gitlab-runner"
  rules:
    - resources: ["secrets", "pods", "pods/exec", "pods/attach"]
      verbs: ["get", "delete", "create", "update"]
serviceAccount:
  create: true
nodeSelector:
  dedicated: dev
tolerations:
- effect: NoSchedule
  key: dedicated
  operator: Equal
  value: dev
runners:
  config: |
    concurrent = 3
    check_interval = 5
    [[runners]]
      name = "k8s-runner"
      url = "https://gitlab.com/"
      token = "$token"
      executor = "kubernetes"
      [runners.kubernetes]
        namespace = "dev"
        privileged = true
        service_account = "tgs-build"  