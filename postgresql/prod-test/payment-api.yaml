apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payment-api
    app.kubernetes.io/name: payment-api
    tgs.kind: payment
  name: payment-api
  namespace: prod-old
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: payment-api
      app.kubernetes.io/name: payment-api
      tgs.kind: payment
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8889"
        prometheus.io/scrape: "true"
      creationTimestamp: null
      labels:
        app: payment-api
        app.kubernetes.io/name: payment-api
        tgs.kind: payment
    spec:
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: Payment-Api(prod)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: ConnectionStrings__Tgs
          valueFrom:
            secretKeyRef:
              key: tgs
              name: tgs-connections
        - name: ConnectionStrings__RedisConfigurationString
          valueFrom:
            secretKeyRef:
              key: redis
              name: tgs-connections
        - name: ConnectionStrings__Nats
          valueFrom:
            secretKeyRef:
              key: nats
              name: tgs-connections
        - name: STAKATER_TGS_CONNECTIONS_SECRET
          value: 49e16a9db0eb035ef5213c2abb85424fc56e1c7a
        - name: STAKATER_CONFIGMAP_PAYMENT_API_CONFIGMAP
          value: d466fd8eecec9467d83b7e9a10ad4a454a0a6381
        image: pgtgs/payment-api:202403180718.461
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        name: payment
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 300Mi
        securityContext: {}
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.Production.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub
      nodeSelector:
        dedicated: prod
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      volumes:
      - configMap:
          defaultMode: 420
          name: configmap-payment-api
        name: appsettings
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: payment-api
    app.kubernetes.io/name: payment-api
    tgs.kind: payment
  name: payment-api
  namespace: prod-old
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: payment-api
    app.kubernetes.io/name: payment-api
    tgs.kind: payment
---
apiVersion: v1
data:
