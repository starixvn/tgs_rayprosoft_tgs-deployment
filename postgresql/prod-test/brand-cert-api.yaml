              fieldPath: status.hostIP
        - name: ConnectionStrings__Tgs
          valueFrom:
            secretKeyRef:
              key: tgs
              name: tgs-connections
        - name: ConnectionStrings__Nats
          valueFrom:
            secretKeyRef:
              key: nats
              name: tgs-connections
        - name: Brand__SecurityKeyPath
          value: /config/certs/key.pem
        - name: STAKATER_CONFIGMAP_BRAND_CERT_API_CONFIGMAP
          value: decb1a420f28980039249d8d42ac700834a9c765
        - name: STAKATER_TGS_CONNECTIONS_SECRET
          value: 49e16a9db0eb035ef5213c2abb85424fc56e1c7a
        image: pgtgs/brand-cert-api:202402220050.79
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: brand-cert-api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 400Mi
          requests:
            cpu: 100m
            memory: 400Mi
        securityContext: {}
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.Production.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
        - mountPath: /config/certs/key.pem
          name: cert
          readOnly: true
          subPath: key.pem
        - mountPath: /diag
          name: diagvol
        - mountPath: /dumps
          name: dumpsvol
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub
      nodeSelector:
        dedicated: prod
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      volumes:
      - configMap:
          defaultMode: 420
          name: configmap-brand-cert-api
        name: appsettings
      - name: cert
        secret:
          defaultMode: 420
          secretName: brand-cert
      - emptyDir: {}
        name: diagvol
      - emptyDir: {}
        name: dumpsvol
---
