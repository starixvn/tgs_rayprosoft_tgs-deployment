apiVersion: apps/v1
kind: Deployment
metadata:
  generation: 8
  labels:
    app: report-api
  name: report-api
  namespace: prod-old
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: report-api
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: report-api
    spec:
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: Report-Api(prod)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: ConnectionStrings__Tgs
          valueFrom:
            secretKeyRef:
              key: tgs
              name: tgs-connections
        - name: ConnectionStrings__Nats
          valueFrom:
            secretKeyRef:
              key: nats
              name: tgs-connections
        image: pgtgs/report-api:202403210321.89
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        name: report-api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 512Mi
        securityContext: {}
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.Production.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
        - mountPath: /etc/ssl/certs/rds-combined-ca-bundle.pem
          name: rds-combined-ca-bundle
          readOnly: true
          subPath: rds-combined-ca-bundle.pem
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub
      nodeSelector:
        dedicated: prod
      restartPolicy: Always
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      volumes:
      - configMap:
          defaultMode: 420
          name: configmap-report-api
        name: appsettings
      - configMap:
          defaultMode: 420
          name: configmap-mongodb-pem
        name: rds-combined-ca-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: report-api
  namespace: prod-old
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: report-api
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
data:
  appsettings.json: |
    {
      "Report": {
        "GameProvidersPluggableBaseUrl": "http://game-pluggable-service",
        "PlayerServiceBaseUrl": "http://player-api",
        "BrandCertificate": "http://brand-cert-api"
      }
    }
kind: ConfigMap
metadata:
  name: configmap-report-api
  namespace: prod-old
