apiVersion: apps/v1
kind: Deployment
metadata:
  name: player-all-agent-service
  namespace: prod-old
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: tgs
      app.kubernetes.io/name: player-all-agent-service
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "52325"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/instance: tgs
        app.kubernetes.io/name: player-all-agent-service
    spec:
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: Player-All-Agent-Service(prod)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: ConnectionStrings__Tgs
          valueFrom:
            secretKeyRef:
              key: tgs
              name: tgs-connections
        - name: ConnectionStrings__Redis
          valueFrom:
            secretKeyRef:
              key: redis
              name: tgs-connections
        - name: ConnectionStrings__Nats
          valueFrom:
            secretKeyRef:
              key: nats
              name: tgs-connections
        image: pgtgs/player-all-agent-service:202401020912.23
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: player-all-agent-service
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: "1"
            memory: 600Mi
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config/appsettings.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub
      nodeSelector:
        dedicated: prod
      restartPolicy: Always
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      volumes:
      - configMap:
          defaultMode: 420
          name: configmap-player-all-agent-service
        name: appsettings
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: tgs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: player-all-agent-service
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: player-all-agent-service-0.1.0
  name: player-all-agent-service
  namespace: prod-old
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: tgs
    app.kubernetes.io/name: player-all-agent-service
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
data:
  appsettings.json: |
    {
      "PlayerAllAgentRebate": {
        "CashBaseUrl": "http://cashservice-api",
        "PlayerBucketBaseUrl": "http://tgs-playerbucket-service",
        "PlayerServiceBaseUrl": "http://player-api"
      }
    }
  otel-collector-config.yaml: "receivers:\n  otlp:\n    protocols:\n      grpc:\n\nprocessors:\n
    \ batch:\n\nexporters:\n  otlp:\n    endpoint: \"$NODE_IP:4317\"\n    tls:\n      insecure:
    true\n  prometheus:\n    endpoint: \"0.0.0.0:8889\"\n    namespace: \"tgs\"\n\nextensions:\n
    \ health_check:\n    endpoint: 0.0.0.0:13133\n\nservice:\n  extensions: [health_check]\n
    \ pipelines:\n    traces: \n      receivers: [otlp]\n      processors:\n        -
    batch\n      exporters: [otlp]\n    metrics:\n      receivers: [otlp]\n      exporters:
    [prometheus]\n"
kind: ConfigMap
metadata:
  name: configmap-player-all-agent-service
  namespace: prod-old
