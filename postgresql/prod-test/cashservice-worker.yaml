apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cashservice-worker
    app.kubernetes.io/name: cashservice-worker
    tgs.kind: cash
  name: cashservice-worker
  namespace: prod-old
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cashservice-worker
      app.kubernetes.io/name: cashservice-worker
      tgs.kind: cash
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2024-04-22T23:00:13Z"
        prometheus.io/path: /metrics
        prometheus.io/port: "8889"
        prometheus.io/scrape: "true"
      creationTimestamp: null
      labels:
        app: cashservice-worker
        app.kubernetes.io/name: cashservice-worker
        tgs.kind: cash
    spec:
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: Cash-Worker(prod)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: ConnectionStrings__Tgs
          valueFrom:
            secretKeyRef:
              key: tgs
              name: tgs-connections
        - name: ConnectionStrings__Redis
          valueFrom:
            secretKeyRef:
              key: redis
              name: tgs-connections
        - name: ConnectionStrings__Nats
          valueFrom:
            secretKeyRef:
              key: nats
              name: tgs-connections
        - name: DOTNET_gcServer
          value: "0"
        - name: STAKATER_TGS_CONNECTIONS_SECRET
          value: 49e16a9db0eb035ef5213c2abb85424fc56e1c7a
        image: pgtgs/cashservice-worker:202403250632.220
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        name: cashservice-worker
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 500Mi
          requests:
            cpu: 300m
            memory: 500Mi
        securityContext: {}
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub
      nodeSelector:
        dedicated: prod
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      volumes:
      - configMap:
          defaultMode: 420
          name: configmap-cashservice-worker
        name: appsettings
---
apiVersion: v1
data:
  otel-collector-config.yaml: "receivers:\n  otlp:\n    protocols:\n      grpc:\n\nprocessors:\n
    \ batch:\n\nexporters:\n  otlp:\n    endpoint: \"$NODE_IP:4317\"\n    tls:\n      insecure:
    true\n  prometheus:\n    endpoint: \"0.0.0.0:8889\"\n    namespace: \"tgs\"\n\nextensions:\n
    \ health_check:\n    endpoint: 0.0.0.0:13133\n\nservice:\n  extensions: [health_check]\n
    \ pipelines:\n    traces: \n      receivers: [otlp]\n      processors:\n        -
    batch\n      exporters: [otlp]\n    metrics:\n      receivers: [otlp]\n      exporters:
    [prometheus]\n"
kind: ConfigMap
metadata:
  name: configmap-cashservice-worker
  namespace: prod-old
