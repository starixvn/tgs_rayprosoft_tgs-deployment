apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  name: backoffice-site
  namespace: prod-old
  resourceVersion: "53557053"
  uid: e15a22cb-9f6e-42af-b7af-f37e76cdf2f6
spec:
  ingressClassName: nginx
  rules:
  - host: prod-old-bo.rpgp.cc
    http:
      paths:
      - backend:
          service:
            name: backoffice-api
            port:
              number: 80
        path: /api
        pathType: ImplementationSpecific
      - backend:
          service:
            name: file-service
            port:
              number: 80
        path: /fs
        pathType: ImplementationSpecific
      - backend:
          service:
            name: backoffice-site
            port:
              number: 80
        path: /
        pathType: ImplementationSpecific
