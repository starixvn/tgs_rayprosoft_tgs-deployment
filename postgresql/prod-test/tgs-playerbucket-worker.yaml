apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: tgs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: playerbucket-worker
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: playerbucket-worker-0.1.0
    tgs.kind: playerbucket
  name: tgs-playerbucket-worker
  namespace: prod-old
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: tgs
      app.kubernetes.io/name: playerbucket-worker
      tgs.kind: playerbucket
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2023-12-25T23:11:19+08:00"
        prometheus.io/path: /metrics
        prometheus.io/port: "8889"
        prometheus.io/scrape: "true"
      creationTimestamp: null
      labels:
        app.kubernetes.io/instance: tgs
        app.kubernetes.io/name: playerbucket-worker
        tgs.kind: playerbucket
    spec:
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: PlayerBucket-Worker(prod)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: ConnectionStrings__Tgs
          valueFrom:
            secretKeyRef:
              key: tgs
              name: tgs-connections
        - name: ConnectionStrings__Nats
          valueFrom:
            secretKeyRef:
              key: nats
              name: tgs-connections
        - name: ConnectionStrings__Redis
          valueFrom:
            secretKeyRef:
              key: redis
              name: tgs-connections
        - name: ConnectionStrings__Mongo
          valueFrom:
            secretKeyRef:
              key: mongo-player-bucket
              name: tgs-connections
        - name: DOTNET_gcServer
          value: "0"
        image: pgtgs/bucket-worker:202310310549.213
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        name: playerbucket-worker
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 400Mi
          requests:
            cpu: 100m
            memory: 400Mi
        securityContext: {}
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config/appsettings.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
        - mountPath: /etc/ssl/certs/rds-combined-ca-bundle.pem
          name: rds-combined-ca-bundle
          readOnly: true
          subPath: rds-combined-ca-bundle.pem
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub
      nodeSelector:
        dedicated: prod
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      volumes:
      - configMap:
          defaultMode: 420
          name: configmap-tgs-playerbucket-worker
        name: appsettings
      - name: rds-combined-ca-bundle
        secret:
          defaultMode: 420
          secretName: rds-combined-ca-bundle
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: tgs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: playerbucket-worker
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: playerbucket-worker-0.1.0
    tgs.kind: playerbucket
  name: tgs-playerbucket-worker
  namespace: prod-old
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: tgs
    app.kubernetes.io/name: playerbucket-worker
    tgs.kind: playerbucket
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: v1
data:
  appsettings.json: |
    {
      "OpenTelemetry": {
        "Tracing": {
          "Endpoint": "http://localhost:4317",
          "ExportProcessorType": "Batch"
        }
      },
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
        }
      }
    }
  otel-collector-config.yaml: "receivers:\n  otlp:\n    protocols:\n      grpc:\n\nprocessors:\n
    \ batch:\n\nexporters:\n  otlp:\n    endpoint: \"$NODE_IP:4317\"\n    tls:\n      insecure:
    true\n  prometheus:\n    endpoint: \"0.0.0.0:8889\"\n    namespace: \"tgs\"\n\nextensions:\n
    \ health_check:\n    endpoint: 0.0.0.0:13133\n\nservice:\n  extensions: [health_check]\n
    \ pipelines:\n    traces: \n      receivers: [otlp]\n      processors:\n        -
    batch\n      exporters: [otlp]\n    metrics:\n      receivers: [otlp]\n      exporters:
    [prometheus]\n"
kind: ConfigMap
metadata:
  name: configmap-tgs-playerbucket-worker
  namespace: prod-old