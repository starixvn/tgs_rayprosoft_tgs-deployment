apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: marketing-report-api
    app.kubernetes.io/instance: RELEASE-NAME
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: marketing-report-api
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: marketing-report-api-0.1.0
    tgs.kind: report
  name: marketing-report-api
  namespace: prod
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: marketing-report-api
      app.kubernetes.io/instance: RELEASE-NAME
      app.kubernetes.io/name: marketing-report-api
      tgs.kind: report
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "52325"
        prometheus.io/scrape: "true"
      creationTimestamp: null
      labels:
        app: marketing-report-api
        app.kubernetes.io/instance: RELEASE-NAME
        app.kubernetes.io/name: marketing-report-api
        tgs.kind: report
    spec:
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: Marketing-Report-Api(prod)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: ConnectionStrings__Tgs
          valueFrom:
            secretKeyRef:
              key: tgs
              name: tgs-connections
        - name: Schedule__ExecuteTime
          value: "06:00:00"
        - name: STAKATER_CONFIGMAP_MARKETING_REPORT_API_CONFIGMAP
          value: decb1a420f28980039249d8d42ac700834a9c765
        - name: STAKATER_TGS_CONNECTIONS_SECRET
          value: 49e16a9db0eb035ef5213c2abb85424fc56e1c7a
        image: pgtgs/marketing-report-api:202403220137.36
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        name: marketing-report-api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 300m
            memory: 1200Mi
          requests:
            cpu: 300m
            memory: 400Mi
        securityContext: {}
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.Production.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub
      nodeSelector:
        dedicated: prod
      restartPolicy: Always
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      volumes:
      - configMap:
          defaultMode: 420
          name: configmap-marketing-report-api
        name: appsettings
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: marketing-report-api
    app.kubernetes.io/instance: RELEASE-NAME
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: marketing-report-api
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: marketing-report-api-0.1.0
    tgs.kind: report
    velero.io/backup-name: svc-1115
    velero.io/restore-name: svc
  name: marketing-report-api
  namespace: prod-old
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: marketing-report-api
    app.kubernetes.io/instance: RELEASE-NAME
    app.kubernetes.io/name: marketing-report-api
    tgs.kind: report
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
data:
  appsettings.json: |
    {
    }
  otel-collector-config.yaml: "receivers:\n  otlp:\n    protocols:\n      grpc:\n\nprocessors:\n
    \ batch:\n\nexporters:\n  otlp:\n    endpoint: \"$NODE_IP:4317\"\n    tls:\n      insecure:
    true\n  prometheus:\n    endpoint: \"0.0.0.0:8889\"\n    namespace: \"tgs\"\n\nextensions:\n
    \ health_check:\n    endpoint: 0.0.0.0:13133\n\nservice:\n  extensions: [health_check]\n
    \ pipelines:\n    traces: \n      receivers: [otlp]\n      processors:\n        -
    batch\n      exporters: [otlp]\n    metrics:\n      receivers: [otlp]\n      exporters:
    [prometheus]\n"
kind: ConfigMap
metadata:
  name: configmap-marketing-report-api
  namespace: prod-old
