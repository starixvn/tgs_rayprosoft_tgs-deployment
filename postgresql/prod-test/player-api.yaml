apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: RELEASE-NAME
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: player-api
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: player-api-0.1.0
  name: player-api
  namespace: prod-old
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: RELEASE-NAME
      app.kubernetes.io/name: player-api
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2023-11-21T03:02:57Z"
        prometheus.io/path: /metrics
        prometheus.io/port: "8889"
        prometheus.io/scrape: "true"
      creationTimestamp: null
      labels:
        app.kubernetes.io/instance: RELEASE-NAME
        app.kubernetes.io/name: player-api
    spec:
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: Player-Api(prod)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: DOTNET_gcServer
          value: "0"
        - name: ConnectionStrings__Tgs
          valueFrom:
            secretKeyRef:
              key: tgs
              name: tgs-connections
        image: pgtgs/player-api:202402170737.207
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        name: player-api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 400Mi
        securityContext: {}
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/appsettings.Production.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub
      nodeSelector:
        dedicated: prod
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      volumes:
      - configMap:
          defaultMode: 420
          name: configmap-player-api
        name: appsettings
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: RELEASE-NAME
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: player-api
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: player-api-0.1.0
  name: player-api
  namespace: prod-old
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: RELEASE-NAME
    app.kubernetes.io/name: player-api
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
data:
  appsettings.json: |
    {
      "OpenTelemetry": {
        "Tracing": {
          "Endpoint": "http://localhost:4317",
          "ExportProcessorType": "Batch"
        }
      },
      "PlayerService": {
        "MarketingReportBaseUrl": "http://marketing-report-api",
        "CashServiceBaseUrl": "http://cashservice-api"
      }
    }
  otel-collector-config.yaml: "receivers:\n  otlp:\n    protocols:\n      grpc:\n\nprocessors:\n
    \ batch:\n\nexporters:\n  otlp:\n    endpoint: \"$NODE_IP:4317\"\n    tls:\n      insecure:
    true\n  prometheus:\n    endpoint: \"0.0.0.0:8889\"\n    namespace: \"tgs\"\n\nextensions:\n
    \ health_check:\n    endpoint: 0.0.0.0:13133\n\nservice:\n  extensions: [health_check]\n
    \ pipelines:\n    traces: \n      receivers: [otlp]\n      processors:\n        -
    batch\n      exporters: [otlp]\n    metrics:\n      receivers: [otlp]\n      exporters:
    [prometheus]\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: RELEASE-NAME
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: player-api
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: player-api-0.1.0
    velero.io/backup-name: svc-1115
    velero.io/restore-name: svc
  name: configmap-player-api
  namespace: prod-old