apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-jaeger
  namespace: observability
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - jaeger.srvptt.com
    secretName: jaeger.srvptt.com
  rules: 
  - host: jaeger.srvptt.com
    http:
      paths:
      - path: /
        backend:
          serviceName: jaeger-operator-metrics 
          servicePort: 8443               