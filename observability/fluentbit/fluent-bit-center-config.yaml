apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-center-config
  namespace: logging
  labels:
    k8s-app: fluent-bit
data:
  input-center.conf: |
    [INPUT]
        Name              forward

  filter-center.conf: |
    [FILTER]
        Name    lua
        Match   log.*
        script  append_tag.lua
        call    append_tag
  
  append_tag.lua: |
    function append_tag(tag, timestamp, record)
        new_record = record
        new_record["es_index"] = "log-"..tag:gsub("log.", ""):lower()
        return 1, timestamp, new_record
    end

  output-center.conf: |
    [OUTPUT]
        Name            es
        Match           kube.*
        Host            ${FLUENT_ELASTICSEARCH_HOST}
        Port            ${FLUENT_ELASTICSEARCH_PORT}
        Logstash_Format On
        Logstash_Prefix kube
        Replace_Dots    On
        Type            log
        Buffer_Size     5M
        Trace_Error     On
    [OUTPUT]
        Name            es
        Match           log.*
        Host            ${FLUENT_ELASTICSEARCH_HOST}
        Port            ${FLUENT_ELASTICSEARCH_PORT}
        Type            log
        Logstash_Format On
        Logstash_Prefix log_unknown
        Logstash_Prefix_Key es_index
        Include_Tag_Key On
        Replace_Dots    On
        Suppress_Type_Name On
        Buffer_Size     5M
        Trace_Error     On
