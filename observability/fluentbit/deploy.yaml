apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-center
  namespace: logging
  labels:
    app: fluent-bit-center
  annotations:
    configmap.reloader.stakater.com/reload: "fluent-bit-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit-center
  template:
    metadata:
      labels:
        app: fluent-bit-center
    spec:
      serviceAccountName: fluent-bit
      containers:
        - name: fluent-bit-center
          image: fluent/fluent-bit:1.8.11
          env:
            - name: FLUENT_ELASTICSEARCH_HOST
              value: "elasticsearch-master.observability"
            - name: FLUENT_ELASTICSEARCH_PORT
              value: "9200"
          ports:
            - containerPort: 24224
              protocol: TCP
            - containerPort: 2020
              protocol: TCP
          volumeMounts:
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/input-kubernetes.conf
              subPath: input-center.conf
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/filter-kubernetes.conf
              subPath: filter-center.conf
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/append_tag.lua
              subPath: append_tag.lua
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/output-kubernetes.conf
              subPath: output-center.conf
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: 24224
            initialDelaySeconds: 3
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 24224
            initialDelaySeconds: 10
            periodSeconds: 20
      terminationGracePeriodSeconds: 10
      volumes:
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-config
