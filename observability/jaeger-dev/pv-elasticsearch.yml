apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-elasticsearch-0
spec:
  storageClassName: manual
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    name: elasticsearch-master-elasticsearch-master-0
    namespace: observability
  nfs:
    server: 192.168.50.111
    path: /nfsshare/elasticsearch
