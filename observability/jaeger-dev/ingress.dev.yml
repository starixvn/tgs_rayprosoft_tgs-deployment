apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: observability
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - jaeger.rpgp.cc
    secretName: jaeger.rpgp.cc
  rules: 
  - host: jaeger.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: jaeger-operator-metrics 
            port: 
              number: 8443