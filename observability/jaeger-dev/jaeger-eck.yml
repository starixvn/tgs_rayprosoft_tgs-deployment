# https://www.jaegertracing.io/docs/1.42/operator/#production-strategy
# kubectl apply -f https://github.com/jaegertracing/jaeger-operator/releases/download/v1.42.0/jaeger-operator.yaml -n observability
apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  name: jaeger-eck
  namespace: observability
spec:
  strategy: production
  storage:
    type: elasticsearch
    dependencies:
      enabled: false
    esIndexCleaner:
      enabled: false
      numberOfDays: 15
      schedule: "55 23 * * *"
    options:
      es:
        server-urls: http://elasticsearch-es-default.eck:9200
        #index-prefix: tracing
        num-replicas: 0
        num-shards: 1
        create-index-templates: "false"
        version: 7
  collector:
    autoscale: false
    options:
      es: 
        use-aliases: true
  query:
    options:
      es: 
        use-aliases: true
  ui:
    options:
      dependencies:
        menuEnabled: true
      menu:
        - label: "About Jaeger"
          items:
            - label: "Documentation"
              url: "https://www.jaegertracing.io/docs/latest"
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "1"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: dedicated
            operator: Equal
            values: dev
  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: dev
  serviceAccount: jaeger-operator
  securityContext:
    runAsUser: 1000
  ingress:
    security: none
    ingressClassName: nginx
    hosts:
      - "jaeger.rpgp.cc"