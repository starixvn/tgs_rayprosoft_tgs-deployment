apiVersion: v1
kind: Service
metadata:
  name: otel-svc
  namespace: observability
spec:
  selector:
    name: otel-collector
  type: ClusterIP
  sessionAffinity: None
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: otlp
      protocol: TCP
      port: 4317
      targetPort: 4317
