apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: observability
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 220.132.206.70/32;
      deny all;
spec:
  ingressClassName: nginx
  rules:
  - host: kibana.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: kibana-kibana
            port: 
              number: 5601