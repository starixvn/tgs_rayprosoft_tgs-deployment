# https://opentelemetry.io/docs/collector/configuration/
# https://ithelp.ithome.com.tw/articles/10290149
# https://ithelp.ithome.com.tw/articles/10290703
# https://ithelp.ithome.com.tw/articles/10291371

apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-otel-collector
  namespace: observability
data:
  otel-config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
    exporters:
      logging:
        loglevel: debug
      otlp/jaeger:
        endpoint: jaeger-eck-collector:4317
        tls:
          insecure: true
    extensions:
      health_check:
      pprof:
      zpages:
    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger]
