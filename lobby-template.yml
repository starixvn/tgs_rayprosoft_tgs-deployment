kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: ${lobby}
  labels:
    app: ${lobby}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ${lobby}
  template:
    metadata:
      labels:
        app: ${lobby}
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: ${lobby}
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/${lobby}:demo
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ${lobby}
  namespace: dev
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: ${lobby}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: certificate-${lobby}
  namespace: dev
spec:
  secretName: secret-${lobby}
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt
    kind: Issuer
    group: cert-manager.io
  dnsNames:
  - ${lobby}.tgsdev.gq
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-${lobby}
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - ${lobby}.tgsdev.gq
    secretName: secret-${lobby}
  rules:
  - host: ${lobby}.tgsdev.gq
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: ${lobby}
            port: 
              number: 80