apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-{{ .Values.gpName }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - {{ .Values.gpName }}.rpgp.cc
    secretName: {{ .Values.gpName }}.rpgp.cc
  rules:
  - host: {{ .Values.gpName }}.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          serviceName: {{ .Values.gpName }}
          servicePort: 80