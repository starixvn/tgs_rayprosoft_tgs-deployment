apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-rabbitmq-dev
spec:
  storageClassName: manual
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: rabbitmq
    name: persistence-mq-server-0
  nfs:
    server: 192.168.50.111
    path: /nfsshare/rabbitmq/dev
---
