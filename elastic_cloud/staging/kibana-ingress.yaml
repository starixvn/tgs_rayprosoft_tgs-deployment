apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: valhalla-kibana-ingress
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
    - host: stg-kibana.rpgp.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana-kb-http
                port:
                  number: 5601
