apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: observability
spec:
  version: 8.5.1
  count: 1
  config:
    elasticsearch.hosts:
      - http://elasticsearch-master:9200
    csp.strict: false
  http:
    service:
      spec:
        type: ClusterIP
    tls:
      selfSignedCertificate:
        disabled: true