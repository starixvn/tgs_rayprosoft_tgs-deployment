kind: Deployment
apiVersion: apps/v1
metadata:
  name: mocksite
  namespace: trial
  labels:
    app: mocksite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mocksite
  template:
    metadata:
      labels:
        app: mocksite
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: mocksite
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/mocksite:staging
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 150m
              memory: 300Mi
            requests:
              cpu: 150m
              memory: 300Mi
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mocksite
  namespace: trial
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: mocksite