apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: trial
  labels:
    app: file-service
spec:
  selector:
    matchLabels:
      app: file-service
  replicas: 1
  template:
    metadata:
      labels:
        app: file-service
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: file-service
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/file-service:staging
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          env:
            - name: aspnetcore_environment
              value: "Staging"
            - name: aspnetcore_https_port
              value: "443"
          volumeMounts:
            - mountPath: /app/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
      volumes:
        - name: appsettings
          configMap:
            name: configmap-fileservice
---
apiVersion: v1
kind: Service
metadata: 
  name: file-service
  namespace: staging
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: file-service  