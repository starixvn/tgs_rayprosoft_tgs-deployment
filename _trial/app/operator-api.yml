apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-api
  namespace: trial
  labels:
    app: operator-api
spec:
  selector:
    matchLabels:
      app: operator-api
  replicas: 1
  template:
    metadata:
      labels:
        app: operator-api
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: operator-api
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/operator-api:stag
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            limits:
              cpu: 400m
              memory: 1000Mi
            requests:
              cpu: 400m
              memory: 1000Mi
          env:
            - name: aspnetcore_environment
              value: "Staging"
            - name: aspnetcore_https_port
              value: "443"
          volumeMounts:
            - mountPath: /config/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json 
      volumes:
        - name: appsettings
          configMap:
            name: operator-api
---
apiVersion: v1
kind: Service
metadata: 
  name: operator-api
  namespace: trial
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    service.beta.kubernetes.io/aws-load-balancer-internal: 0.0.0.0/0
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: operator-api                    