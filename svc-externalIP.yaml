apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: payment-test
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt"
    nginx.ingress.kubernetes.io/upstream-vhost: 192.68.50.44
    nginx.ingress.kubernetes.io/proxy-body-size: "5000m"
spec:
  rules:
  - host: payment.rpgp.cc
    http:
      paths:
      - backend:
          serviceName: payment-test-asset
          servicePort: 80
  tls:
  - secretName: payment-rpgp-assets
    hosts:
    - payment.rpgp.cc
---
apiVersion: v1
kind: Service
metadata:
  name: payment-test-asset
spec:
  ports:
  - name: app
    port: 80
    protocol: TCP
    targetPort: 5000
  clusterIP: None
  type: ClusterIP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: payment-test-asset
subsets:
- addresses:
  - ip: 192.168.50.44
  ports:
  - name: app
    port: 5000
    protocol: TCP