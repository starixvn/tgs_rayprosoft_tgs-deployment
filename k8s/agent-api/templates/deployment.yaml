apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-api.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    type: backend
    {{- include "agent-api.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agent-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        type: backend
        {{- include "agent-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if eq .Values.namespace "staging" }}
      nodeSelector:
        dedicated: nonprod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: nonprod
      {{- end }}
      {{- if eq .Values.namespace "prod" }}
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: OTEL_SERVICE_NAME
              value: Agent-Api({{ .Values.namespace }})
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: Logging__Console__FormatterName
              value: json
            - name: DOTNET_DiagnosticPorts
              value: /diag/port
          volumeMounts:
            - mountPath: /config/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
            - mountPath: /diag
              name: diagvol
            - mountPath: /dumps
              name: dumpsvol
          livenessProbe:
            httpGet:
              path: /health
              port: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: monitor
          image: mcr.microsoft.com/dotnet/monitor:6.0.0
          args: [ "--no-auth" ]
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DOTNETMONITOR_DiagnosticPort__ConnectionMode
              value: Listen
            - name: DOTNETMONITOR_DiagnosticPort__EndpointName
              value: /diag/port
            - name: DOTNETMONITOR_Storage__DumpTempFolder
              value: /dumps
            - name: DOTNETMONITOR_Urls
              value: http://+:52324
            - name: DOTNETMONITOR_Metrics__Endpoints
              value: http://+:52325
            - name: XDG_CONFIG_HOME
              value: /config
          volumeMounts:
            - mountPath: /diag
              name: diagvol
            - mountPath: /dumps
              name: dumpsvol
            - mountPath: /config/dotnet-monitor/settings.json
              name: appsettings
              readOnly: true
              subPath: monitor.settings.json
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: appsettings
          configMap:
            name: configmap-{{ include "agent-api.fullname" . }}
        - name: diagvol
          emptyDir: {}
        - name: dumpsvol
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
