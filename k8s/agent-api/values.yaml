# Default values for agent-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: registry.gitlab.com/rayprosoft/turnkey-gaming-system/agent-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "dev"

imagePullSecrets:
  - name: registry-credentials
nameOverride: "agent-api"
fullnameOverride: "agent-api"
namespace: dev

podAnnotations: {}

connectionStrings:
  tgs: Server=pgpool;Port=9999;Database=tgs;User Id=rpdev;Password=abcd1234
  redis: redis-master,abortConnect=false,connectTimeout=3000,password=1qaz2wsx

nats:
  urls: nats://nats-client:4222

mail:
  url: https://email.srvptt.com
  
aspNetCoreEnvironment: Development

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  runAsUser: 0
  runAsGroup: 0

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 200m
    memory: 400Mi
  requests:
    cpu: 200m
    memory: 400Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 60

nodeSelector: {}

tolerations: []

affinity: {}
