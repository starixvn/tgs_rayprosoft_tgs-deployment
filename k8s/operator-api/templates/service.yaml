apiVersion: v1
kind: Service
metadata:
  name: {{ include "operator-api.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "operator-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{ if eq .Values.namespace "dev" }}
    - port: {{ .Values.service.port }}
      targetPort: yarp
      protocol: TCP
      name: http
    {{ else }}
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{ end }}
  selector:
    {{- include "operator-api.selectorLabels" . | nindent 4 }}
