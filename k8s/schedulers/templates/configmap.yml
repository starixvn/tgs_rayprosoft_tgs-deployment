apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "schedulers.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "System.Net.Http.HttpClient": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      },
      "AllowedHosts": "*",
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}",
        "RedisConfigurationString": "{{ .Values.connectionStrings.redis }}",
        "Nats": "{{ .Values.nats.urls }}"
      },
      "Hangfire": {
        "ConnectionString": "{{ .Values.connectionStrings.redis }}",
        "Prefix": "hangfire.postgres",
        "Schedule": { "SchedulePollingInterval": 15 }
      },
      "Schedule": {
        "ReportAggregate": "http://report-aggregate-service",
        "Promotion": "http://promotion-api",
        "PromotionRebate": "https://promotion-rebate",
        "Email": "{{ .Values.mail.url }}"
      },
      "ProfitRebate": {
        "Url": "http://profit-rebate-service"
      }
    }