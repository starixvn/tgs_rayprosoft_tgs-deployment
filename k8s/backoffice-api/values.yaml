# Default values for backoffice-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: registry.gitlab.com/rayprosoft/turnkey-gaming-system/backoffice-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "dev"

imagePullSecrets:
  - name: registry-credentials
nameOverride: "backoffice-api"
fullnameOverride: "backoffice-api"
namespace: dev

podAnnotations:
  prometheus.io/path: /metrics
  prometheus.io/port: "52325"
  prometheus.io/scrape: "true"

connectionStrings:
  tgs: Server=pgpool;Port=9999;Database=tgs;User Id=rpdev;Password=abcd1234
  redis: redis-master,abortConnect=false,connectTimeout=3000,password=1qaz2wsx

nats:
  urls: nats://nats-client:4222

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
    # cpu: 2000m
    # memory: 2000Mi
  # requests:
    # cpu: 1000m
    # memory: 1000Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
