# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
alertmanager:
  enabled: true
  config:
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'dev-telegram'
      routes:
      - receiver: 'dev-telegram'
        matchers:
        - alertname =~ "InfoInhibitor|Watchdog"
    receivers:
    - name: 'dev-telegram'
      telegram_configs:
      - bot_token: 6137223098:AAEeQiBaQ1G1Gj5pO7p9q_FVwvXViM1BMcg
        api_url: https://api.telegram.org
        chat_id: -1001616967294
        parse_mode: ''
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - alertmanager.rpgp.cc
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
grafana: 
  ingress: 
    enabled: true
    ingressClassName: nginx
    hosts:
    - grafana.rpgp.cc
kubeetcd: 
  caFile: /etc/prometheus/secrets/etcd-certs/ca.crt
  certFile: /etc/prometheus/secrets/etcd-certs/healthcheck-client.crt
  keyFile: /etc/prometheus/secrets/etcd-certs/healthcheck-client.key
prometheus:
  service:
    type: NodePort
  ingress: 
    enabled: true
    ingressClassName: nginx
    hosts:
    - prometheus.rpgp.cc
  prometheusSpec:
    secrets: ["etcd-certs"]
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    storageSpec: 
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
thanosRuler:
  ruleSelectorNilUsesHelmValues: false
    