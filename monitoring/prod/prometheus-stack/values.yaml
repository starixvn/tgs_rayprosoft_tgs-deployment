# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
# helm -n monitoring upgrade --reuse-values -f values.yaml prometheus-stack prometheus-community/kube-prometheus-stack 
alertmanager:
  enabled: true
  service:
    ipDualStack:
      enabled: false
  config:
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'prod-telegram'
      routes:
      - receiver: 'prod-telegram'
        matchers:
        - alertname =~ "InfoInhibitor|Watchdog"
    receivers:
    - name: 'prod-telegram'
      telegram_configs:
      - bot_token: 6137223098:AAEeQiBaQ1G1Gj5pO7p9q_FVwvXViM1BMcg
        api_url: https://api.telegram.org
        chat_id: -1001531627516
        parse_mode: ''
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - alertmanager.yydsgo.xyz
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
grafana: 
  ingress: 
    enabled: true
    ingressClassName: nginx
    hosts:
    - grafana-stack.yydsgo.xyz
    - prod-grafana-stack.rpgp.cc
  serviceMonitor:
    enabled: false
# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml#L1836
kubeScheduler:
  enabled: true
  endpoints: []
  service:
    enabled: true
    port: null
    targetPort: null
    ipDualStack:
      enabled: false
  serviceMonitor:
    enabled: true
    
kubeProxy:
  enabled: true
  endpoints: []
  service:
    enabled: true
    port: 10249
    targetPort: 10249
    ipDualStack:
      enabled: false
  serviceMonitor:
    enabled: true

kubeEtcd:
  enabled: true
  endpoints: []
  service:
    enabled: true
    port: 2381
    targetPort: 2381
    ipDualStack:
      enabled: false
  serviceMonitor:
    enabled: true
    metricRelabelings:
    - action: drop
      regex: '.*_bucket'
      sourceLabels:
      - __name__
    
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        regex: '.*_bucket'
        sourceLabels:
        - __name__
kubelet:
  serviceMonitor:
    probesMetricRelabelings:
    - sourceLabels: [__name__]
      separator: ;
      regex: '.*_bucket'
      replacement: $1
      action: drop
    cAdvisorMetricRelabelings:
    - sourceLabels: [__name__]
      action: drop
      regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
    - sourceLabels: [__name__]
      action: drop
      regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
    - sourceLabels: [__name__]
      action: drop
      regex: 'container_memory_(mapped_file|swap)'
      action: drop
      regex: 'container_(file_descriptors|tasks_state|threads_max)'
    - sourceLabels: [id, pod]
      action: drop
      regex: '.+;'
    - sourceLabels: [__name__]
      action: keep
      regex: '.*'
    metricRelabelings:
    - sourceLabels: [__name__]
      separator: ;
      regex: '.*_bucket'
      replacement: $1
      action: drop
      
kubeControllerManager:
  enabled: true
  service:
    enabled: true
    port: null
    targetPort: null
    ipDualStack:
      enabled: false
  serviceMonitor:
    enabled: true
    
coreDns:
  enabled: true
  service:
    enabled: true
    port: 9153
    targetPort: 9153
    ipDualStack:
      enabled: false
  serviceMonitor:
    enabled: true

prometheusOperator:
  service:
    ipDualStack:
      enabled: false
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true
      serviceAccount:
        create: true
        automountServiceAccountToken: true
  resources: 
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 100Mi
prometheus:
  service:
    ipDualStack:
      enabled: false
  ingress: 
    enabled: true
    ingressClassName: nginx
    hosts:
    - prometheus.yydsgo.xyz
  prometheusSpec:
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    retention: 14d
    nodeSelector: 
      dedicated: prometheus
    tolerations:
    - effect: NoSchedule
      key: dedicated
      operator: Equal
      value: prometheus
    resources: 
      requests:
        cpu: 2
        memory: 14Gi
    additionalScrapeConfigs:
      - job_name: 'prometheus-node-expoter'
        scrape_interval: 30s
        metrics_path: /metrics
        scheme: https
        static_configs:
          - targets: ['prometheus-stack-prometheus-node-exporter:9100']
      - job_name: 'kubernetes-pods'
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod

        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape_slow]
            action: drop
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            regex: (https?)
            target_label: __scheme__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            action: replace
            regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
            replacement: '[$2]:$1'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            action: replace
            regex: (\d+);((([0-9]+?)(\.|$)){4})
            replacement: $2:$1
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
            replacement: __param_$1
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed|Completed
            action: drop
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: node
    storageSpec: 
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 200Gi