apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pod-monitor-devops
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - devops
  selector: 
    matchExpressions:
    - key: app.kubernetes.io/instance:
      operator: Exists
  podMetricsEndpoints:
  - targetPort: 8889