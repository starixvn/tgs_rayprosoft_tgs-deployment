# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
defaultRules:
  create: true
  rules:
    kubelet: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
    - source_matchers:
      - 'severity = critical'
      target_matchers:
      - 'severity =~ warning|info'
      equal:
      - 'namespace'
      - 'alertname'
    - source_matchers:
      - 'severity = warning'
      target_matchers:
      - 'severity = info'
      equal:
      - 'namespace'
      - 'alertname'
    - source_matchers:
      - 'alertname = InfoInhibitor'
      target_matchers:
      - 'severity = info'
      equal:
       - 'namespace'
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'staging-telegram'
      routes:
      - receiver: 'staging-telegram'
        matchers:
        - alertname =~ "InfoInhibitor|Watchdog"
    receivers:
    - name: 'staging-telegram'
      telegram_configs:
      - bot_token: 6137223098:AAEeQiBaQ1G1Gj5pO7p9q_FVwvXViM1BMcg
        api_url: https://api.telegram.org
        chat_id: -1001928893410
        parse_mode: ''
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - stg-alertmanager.rpgp.cc
  alertmanagerSpec:
    nodeSelector:
      dedicated: staging
    tolerations:
    - effect: NoSchedule
      key: dedicated
      operator: Equal
      value: staging  
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
grafana: 
  nodeSelector:
    dedicated: staging
  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: staging  
  ingress: 
    enabled: true
    ingressClassName: nginx
    hosts:
    - stg-grafana-stack.rpgp.cc
  serviceMonitor:
    enabled: false
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        regex: '.*_bucket'
        sourceLabels:
        - __name__
kubelet:
  serviceMonitor:
    probesMetricRelabelings:
    - sourceLabels: [__name__]
      separator: ;
      regex: '.*_bucket'
      replacement: $1
      action: drop
    cAdvisorMetricRelabelings:
    - sourceLabels: [__name__]
      action: drop
      regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
    - sourceLabels: [__name__]
      action: drop
      regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
    - sourceLabels: [__name__]
      action: drop
      regex: 'container_memory_(mapped_file|swap)'
      action: drop
      regex: 'container_(file_descriptors|tasks_state|threads_max)'
    - sourceLabels: [id, pod]
      action: drop
      regex: '.+;'
    - sourceLabels: [__name__]
      action: keep
      regex: '.*'
    metricRelabelings:
    - sourceLabels: [__name__]
      separator: ;
      regex: '.*_bucket'
      replacement: $1
      action: drop
kubeControllerManager:
  serviceMonitor:
    enabled: false
kubeEtcd:
  serviceMonitor:
    metricRelabelings:
    - action: drop
      regex: '.*_bucket'
      sourceLabels:
      - __name__
coreDns:
  serviceMonitor:
    enabled: false
prometheusOperator:
  resources: 
    limits:
      cpu: 200m
      memory: 200Mi
   requests:
     cpu: 100m
     memory: 100Mi
prometheus:
  ingress: 
    enabled: true
    ingressClassName: nginx
    hosts:
    - stg-prometheus.rpgp.cc
  prometheusSpec:
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    nodeSelector:
      dedicated: staging
    tolerations:
    - effect: NoSchedule
      key: dedicated
      operator: Equal
      value: staging  
    resources:
      limits:
        cpu: 2000m
        memory: 3000Mi
      requests:
        cpu: 500m
        memory: 1000Mi
    additionalScrapeConfigs:
      - job_name: 'kubernetes-pods'
        honor_labels: true

        kubernetes_sd_configs:
          - role: pod

        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape_slow]
            action: drop
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            regex: (https?)
            target_label: __scheme__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            action: replace
            regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
            replacement: '[$2]:$1'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            action: replace
            regex: (\d+);((([0-9]+?)(\.|$)){4})
            replacement: $2:$1
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
            replacement: __param_$1
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed|Completed
            action: drop
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: node
    storageSpec: 
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi