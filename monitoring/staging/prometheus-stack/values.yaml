# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
alertmanager:
  config:
    route:
      receiver: 'staging-telegram'
      routes:
      - receiver: 'staging-telegram'
        matchers:
        - alertname =~ "InfoInhibitor|Watchdog"
    receivers:
    - name: 'staging-telegram'
      telegram_configs:
      - bot_token: 6137223098:AAEeQiBaQ1G1Gj5pO7p9q_FVwvXViM1BMcg
        api_url: https://api.telegram.org
        chat_id: -1001928893410
      parse_mode: ''
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - stg-alertmanager.rpgp.cc
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
grafana: 
  ingress: 
    enabled: true
    hosts:
    - stg-grafana.rpgp.cc
prometheus:
  ingress: 
    enabled: true
    hosts:
    - stg-prometheus.rpgp.cc
  prometheusSpec:
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    storageSpec: 
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi