# Source: payment/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  labels:
    app: payment-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: payment-api
---
# Source: payment/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  labels:
    app: payment-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        {}
      containers:
        - name: payment
          securityContext:
            {}
          image: "registry.gitlab.com/rayprosoft/turnkey-gaming-system/payment-api:v28"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /config/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: appsettings
          configMap:
            name: configmap-payment-api
