apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-umpay
  namespace: dev
  labels:
    app: payment-umpay
spec:
  replicas: 1
  strategy:
    null
  selector:
    matchLabels:
      app: payment-umpay
  template:
    metadata:
      labels:
        app: payment-umpay
    spec:
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        {}
      containers:
        - name: umpay
          securityContext:
            {}
          image: "registry.gitlab.com/rayprosoft/turnkey-gaming-system/umpay:vdev-202108250221"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: applepay__IsSimulation
              value: "true"
          volumeMounts:
            - mountPath: /config/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: appsettings
          configMap:
            name: configmap-payment
---
apiVersion: v1
kind: Service
metadata: 
  name: payment-umpay
  namespace: dev
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: payment-umpay