hydra:
  config:
    dsn: memory
    urls:
      self:
        issuer: https://dev-auth.rpgp.cc
      login: https://dev-session.rpgp.cc/login
      consent: https://dev-session.rpgp.cc/consent
    ttl:
      access_token: 5m
      id_token: 20m
      refresh_token: 24h
      auth_code: 5m
      login_consent_request: 20m

maester:
  enabled: false

ingress:
  public:
    enabled: true
    className: nginx
    hosts:
      - host: dev-auth.rpgp.cc
        paths:
          - path: /
            pathType: ImplementationSpecific
