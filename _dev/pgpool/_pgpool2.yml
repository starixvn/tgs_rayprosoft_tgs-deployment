apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgpool2
  namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pgpool2
  template:
    metadata:
      labels:
        app: pgpool2
    spec:
      containers:
      - name: pgpool2
        image: pgpool/pgpool:4.2.2
        livenessProbe:
          tcpSocket:
            port: 9999
          initialDelaySeconds: 30
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 9999
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          limits:
            cpu: 900m
            memory: 900Mi
          requests:
            cpu: 500m
            memory: 600Mi
        env:
        - name: POSTGRES_USERNAME
          value: tgs_app
        - name: POSTGRES_PASSWORD
          value: abcd1234
        volumeMounts:
        - name: volume-config
          mountPath: /config
      - name: pgpool-stats
        image: pgpool/pgpool2_exporter:1.0
        livenessProbe:
          tcpSocket:
            port: 9719
          initialDelaySeconds: 30
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 9719
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        env:
        - name: POSTGRES_USERNAME
          value: tgs_app
        - name: POSTGRES_PASSWORD
          value: abcd1234
        - name: PGPOOL_SERVICE
          value: "pgpool2"
      volumes:
      - name: volume-config
        configMap:
          name: configmap-pgpool
---
apiVersion: v1
kind: Service
metadata:
  name: pgpool2
  namespace: dev
spec:
  type: NodePort
  selector:
    app: pgpool2
  ports:
  - name: pgpool-port
    protocol: TCP
    port: 9999
    targetPort: 9999
    nodePort: 30303
---
apiVersion: v1
kind: Service
metadata:
  name: pgpool-stats2
  namespace: dev
  labels:
    app: pgpool-stats
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "9719"
    prometheus.io/scrape: "true"
spec:
  selector:
    app: pgpool2
  ports:
  - name: pgpool-stats-port
    protocol: TCP
    port: 9719
    targetPort: 9719