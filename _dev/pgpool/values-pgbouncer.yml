# values.override.yaml example
# https://github.com/cradlepoint/kubernetes-helm-chart-pgbouncer
replicaCount: 1
verbose: 1
users:
  dbuser: tgs_app
databases:
  postgres:
    host: 192.168.50.125
    port: 5432
    user: tgs_app
    dbname: tgs
connectionLimits:
  defaultPoolSize: 20
  minPoolSize: 20
  reservePoolSize: 20
service:
  enabled: true
  type: ClusterIP
  name: "pgbouncer"
  annotations: {}