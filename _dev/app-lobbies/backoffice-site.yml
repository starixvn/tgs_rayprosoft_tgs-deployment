kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: backoffice-site
  labels:
    app: backoffice-site
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backoffice-site
  template:
    metadata:
      labels:
        app: backoffice-site
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: backoffice-site
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/backoffice-site:1.0.2
          imagePullPolicy: Always
          env:
          - name: MODE
            value: "development"
          - name: LOGIN_BUTTON_COLOR
            value: "#212121"
          - name: LOGIN_BUTTON_BACKGROUND
            value: "#f7f7fa"
          - name: HEADER_BACKGROUND
            value: "#f7f7fa"
          - name: HEADER_BUTTON_COLOR
            value: "#212121"
          - name: HEADER_BUTTON_BACKGROUND
            value: "transparent"
          - name: LOGIN_IMAGE_URL
            value: "//images.srvptt.com/GMS%20Logo/GMS.png"
          - name: HEADER_IMAGE_URL
            value: "//images.srvptt.com/GMS%20Logo/GMS.png"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backoffice-site
  namespace: dev
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: backoffice-site
