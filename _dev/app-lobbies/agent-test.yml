kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: agent-test
  labels:
    app: agent-test
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: agent-test
  template:
    metadata:
      labels:
        app: agent-test
    spec:
      imagePullSecrets:
        - name: registry-credentials
      volumes:
        - name: bash-agent
          configMap:
            name: bash-agent
            defaultMode: 0777
      containers:
        - name: agent-gpi
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/agent-gpi:dev
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-agent.sh 80 2019 agent-gpi"]
          volumeMounts:
            - mountPath: /srv/bash-agent.sh
              name: bash-agent
              readOnly: true
              subPath: bash-agent
          env:
          - name: CLIENT
            value: "xdZYrxH3X8xXn2KlhWqB3VB4TjZrHfp4rM5xbHfa8cU3oz6CZDL3HqcuZ07pPQFV"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "TGSTEST"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: agent-689
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/agent-gpi:dev
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-agent.sh 81 2020 agent-689"]
          volumeMounts:
            - mountPath: /srv/bash-agent.sh
              name: bash-agent
              readOnly: true
              subPath: bash-agent
          env:
          - name: CLIENT
            value: "xdZYrxH3X8xXn2KlhWqB3VB4TjZrHfp4rM5xbHfa8cU3oz6CZDL3HqcuZ07pPQFV"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "TGS689"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          ports:
            - containerPort: 81
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-test
  namespace: dev
spec:
  ports:
    - name: agent-gpi
      protocol: TCP
      port: 80
      targetPort: 80
    - name: agent-689
      protocol: TCP
      port: 81
      targetPort: 81
  selector:
    app: agent-test