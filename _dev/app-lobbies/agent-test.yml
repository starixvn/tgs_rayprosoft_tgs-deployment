kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: agent-test
  labels:
    app: agent-test
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: agent-test
  template:
    metadata:
      labels:
        app: agent-test
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: agent-gpi
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/agent-gpi:dev
          imagePullPolicy: Always
          env:
          - name: CLIENT
            value: "xdZYrxH3X8xXn2KlhWqB3VB4TjZrHfp4rM5xbHfa8cU3oz6CZDL3HqcuZ07pPQFV"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "TGSTEST"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          - name: TCP_PORT
            value: "2019"
          - name: HTTP_PORT
            value: "80"
          - name: EXE_PATH
            value: "agent-gpi"
          command:
            - "/bin/sh"
            - "-c"
            - | 
              cp /etc/caddy/Caddyfile-Template /etc/caddy/Caddyfile-${EXE_PATH}
              sed -i "s/{TCP_PORT}/${TCP_PORT}/g" /etc/caddy/Caddyfile-${EXE_PATH}
              sed -i "s/{HTTP_PORT}/${HTTP_PORT}/g" /etc/caddy/Caddyfile-${EXE_PATH}
              sed -i "s/{EXE_PATH}/${EXE_PATH}/g" /etc/caddy/Caddyfile-${EXE_PATH}              
              cp -rf /usr/share/caddy /usr/share/${EXE_PATH}
              caddy run --config /etc/caddy/Caddyfile-${EXE_PATH} --adapter caddyfile
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: agent-689
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/agent-gpi:dev
          imagePullPolicy: Always
          env:
          - name: CLIENT
            value: "xdZYrxH3X8xXn2KlhWqB3VB4TjZrHfp4rM5xbHfa8cU3oz6CZDL3HqcuZ07pPQFV"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "TGS689"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          - name: TCP_PORT
            value: "2020"
          - name: HTTP_PORT
            value: "81"
          - name: EXE_PATH
            value: "agent-689"
          command:
            - "/bin/sh"
            - "-c"
            - | 
              cp /etc/caddy/Caddyfile-Template /etc/caddy/Caddyfile-${EXE_PATH}
              sed -i "s/{TCP_PORT}/${TCP_PORT}/g" /etc/caddy/Caddyfile-${EXE_PATH}
              sed -i "s/{HTTP_PORT}/${HTTP_PORT}/g" /etc/caddy/Caddyfile-${EXE_PATH}
              sed -i "s/{EXE_PATH}/${EXE_PATH}/g" /etc/caddy/Caddyfile-${EXE_PATH}              
              cp -rf /usr/share/caddy /usr/share/${EXE_PATH}
              caddy run --config /etc/caddy/Caddyfile-${EXE_PATH} --adapter caddyfile
          ports:
            - containerPort: 81
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-test
  namespace: dev
spec:
  ports:
    - name: agent-gpi
      protocol: TCP
      port: 80
      targetPort: 80
    - name: agent-689
      protocol: TCP
      port: 81
      targetPort: 81
  selector:
    app: agent-test