kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: agent-test
  labels:
    app: agent-test
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: agent-test
  template:
    metadata:
      labels:
        app: agent-test
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: agent-gpi
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/agent-gpi:dev
          imagePullPolicy: Always
          env:
          - name: CLIENT
            value: "xdZYrxH3X8xXn2KlhWqB3VB4TjZrHfp4rM5xbHfa8cU3oz6CZDL3HqcuZ07pPQFV"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "TGSTEST"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          - name: TCP_PORT
            value: "2019"
          - name: HTTP_PORT
            value: "80"
          - name: EXE_PATH
            value: "agent-gpi"
          command:
            - "/bin/sh"
            - "-c"
            - | 
              cat /etc/caddy/Caddyfile
              echo "ls /etc/caddy/="
              ls /etc/caddy/
              envsubst < /etc/caddy/Caddyfile > /etc/caddy/Caddyfile-agent-gpi
              echo "ls /etc/caddy/="
              ls /etc/caddy/
              echo "cat /etc/caddy/Caddyfile-agent-gpi="
              cat /etc/caddy/Caddyfile-agent-gpi
              cp -rf /usr/share/caddy /usr/share/agent-gpi
              echo "ls /etc/caddy/="
              ls /etc/caddy/
              caddy run --config /etc/caddy/Caddyfile-agent-gpi --adapter caddyfile
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-test
  namespace: dev
spec:
  ports:
    - name: agent-gpi
      protocol: TCP
      port: 80
      targetPort: 80
    - name: agent-689
      protocol: TCP
      port: 81
      targetPort: 81
  selector:
    app: agent-test