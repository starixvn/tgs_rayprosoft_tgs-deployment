kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: agent
  labels:
    app: agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: agent
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/agent:dev
          imagePullPolicy: Always
          env:
          - name: CLIENT
            value: "I7nKiimrZQOqnJ6ryjUw74c0Hi64KC6Myunhob4cHh8VOUIuZh4p63czefxyyzbZ"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "PGG"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: dev
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: agent