kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: lobby-t1-merged
  labels:
    app: lobby-t1-merged
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: lobby-t1-merged
  template:
    metadata:
      labels:
        app: lobby-t1-merged
    spec:
      imagePullSecrets:
        - name: registry-credentials
      volumes:
        - name: bash-frontend
          configMap:
            name: bash-frontend
            defaultMode: 0777
      containers:
        - name: lobby-t1
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t1:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 80 2080"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: "I7nKiimrZQOqnJ6ryjUw74c0Hi64KC6Myunhob4cHh8VOUIuZh4p63czefxyyzbZ"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "PGG"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: lobby-gpi-hkd
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t1:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 81 2081"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: "muN0pUt3ZWP53mmRDQdn5TRtc8UxzbzQTXkEQJqaFZ5mb8N4pomQ0V"
          - name: CURRENCY
            value: "HKD"
          - name: BRAND
            value: "PGG"
          - name: DEFAULT_LANGUAGE
            value: "zh-TW"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 81
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: lobby-gpi-thb
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t1:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 82 2082"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: "0smy9rsQHh6BtzZDfRyfLw8mpBnG7mCfpFYMp4VnelxRZ8X3sZfKB2"
          - name: CURRENCY
            value: "THB"
          - name: BRAND
            value: "GPI-THB"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 82
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 82
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 82
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5