kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: lobby-t5-merged
  labels:
    app: lobby-t5-merged
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: lobby-t5-merged
  template:
    metadata:
      labels:
        app: lobby-t5-merged
    spec:
      imagePullSecrets:
        - name: registry-credentials
      volumes:
        - name: bash-frontend
          configMap:
            name: bash-frontend
            defaultMode: 0777
      containers:
        - name: lobby-t5
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t5:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 80 2080"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: "I7nKiimrZQOqnJ6ryjUw74c0Hi64KC6Myunhob4cHh8VOUIuZh4p63czefxyyzbZ"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "PGG"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: lobby-gpi-php
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t5:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 81 2081"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: "usG1iwGDzONgOUFY5hgpX0LAwMQctJ4IQuqug0DEtgwp1DqgbrmaLpM"
          - name: CURRENCY
            value: "PHP"
          - name: BRAND
            value: "GPI-PHP"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 81
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5