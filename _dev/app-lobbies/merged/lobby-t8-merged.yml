kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: staging
  name: lobby-t8-merged
  labels:
    app: lobby-t8-merged
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: lobby-t8-merged
  template:
    metadata:
      labels:
        app: lobby-t8-merged
    spec:
      imagePullSecrets:
        - name: registry-credentials
      volumes:
        - name: bash-frontend
          configMap:
            name: bash-frontend
            defaultMode: 0777
      containers:
        - name: lobby-gpi-t8
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t8:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 80 2080"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: I7nKiimrZQOqnJ6ryjUw74c0Hi64KC6Myunhob4cHh8VOUIuZh4p63czefxyyzbZ
          - name: CURRENCY
            value: CNY
          - name: BRAND
            value: PGG
          - name: DEFAULT_LANGUAGE
            value: zh-CN
          - name: THEME
            value: wapT8
          - name: WAPTEMPLATE
            value: "8"
          - name: SOURCE_URL
            value: https://images.srvptt.com/
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: lobby-gmo
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t8:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 81 2081"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: XJY9uX5RarE5wrOkTHAgkQoGKMuNFxKIXF4A6zR4BfgCHNs1tC7zDv
          - name: CURRENCY
            value: HKD
          - name: BRAND
            value: GMO
          - name: BRANDNAME
            value: GMO
          - name: DEFAULT_LANGUAGE
            value: zh-TW
          - name: THEME
            value: GMO
          - name: WAPTEMPLATE
            value: "9"
          - name: SOURCE_URL
            value: https://images.srvptt.com/
          ports:
            - containerPort: 81
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: lobby-mgm
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t8:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 82 2082"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: xlQ39SGX9QN5SYHltlVU81JMco2vsQgFCxaDWH0p9jzyJwUqs3O1aD
          - name: CURRENCY
            value: HKD
          - name: BRAND
            value: MGM
          - name: BRANDNAME
            value: MGM
          - name: DEFAULT_LANGUAGE
            value: zh-TW
          - name: THEME
            value: wapT8
          - name: WAPTEMPLATE
            value: "9"
          - name: SOURCE_URL
