              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: lobby-sky
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t8:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 83 2083"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
