kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: lobby-t8
  labels:
    app: lobby-t8
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: lobby-t8
  template:
    metadata:
      labels:
        app: lobby-t8
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: lobby-t8
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t6:dev
          imagePullPolicy: Always
          env:
          - name: CLIENT
            value: "I7nKiimrZQOqnJ6ryjUw74c0Hi64KC6Myunhob4cHh8VOUIuZh4p63czefxyyzbZ"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "PGG"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "wapT8"
          - name: "WAPTEMPLATE"
            value: "8"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-t8
  namespace: dev
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: lobby-t8
