kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: lobby-gpi-hkd
  labels:
    app: lobby-gpi-hkd
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: lobby-gpi-hkd
  template:
    metadata:
      labels:
        app: lobby-gpi-hkd
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: lobby-gpi-hkd
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t1:dev
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "muN0pUt3ZWP53mmRDQdn5TRtc8UxzbzQTXkEQJqaFZ5mb8N4pomQ0V"
          - name: CURRENCY
            value: "HKD"
          - name: BRAND
            value: "PGG"
          - name: DEFAULT_LANGUAGE
            value: "zh-TW"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-gpi-hkd
  namespace: dev
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: lobby-gpi-hkd
