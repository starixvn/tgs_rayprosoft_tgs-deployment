kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: lobby-gpi-thb
  labels:
    app: lobby-gpi-thb
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: lobby-gpi-thb
  template:
    metadata:
      labels:
        app: lobby-gpi-thb
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: lobby-gpi-thb
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t1:dev
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "0smy9rsQHh6BtzZDfRyfLw8mpBnG7mCfpFYMp4VnelxRZ8X3sZfKB2"
          - name: CURRENCY
            value: "THB"
          - name: BRAND
            value: "PGG"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-gpi-thb
  namespace: dev
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: lobby-gpi-thb
