apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-alert-manager
spec:
  storageClassName: nfs-provisioner
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: monitoring
    name: prometheus-alertmanager
  nfs:
    server: 192.168.50.111
    path: /nfsshare/pushgateway