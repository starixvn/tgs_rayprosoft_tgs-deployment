apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-pushgateway
spec:
  storageClassName: nfs-provisioner
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: monitoring
    name: prometheus-pushgateway
  nfs:
    server: 192.168.50.111
    path: /nfsshare/pushgateway
  