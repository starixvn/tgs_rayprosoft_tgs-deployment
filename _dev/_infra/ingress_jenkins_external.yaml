apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins2
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "5000m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - jenkins.rpgp.cc
    secretName: jenkins.rpgp.cc
  rules:
  - host: jenkins.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: jenkins-assets-ext
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-assets-ext
spec:
  type: ExternalName
  externalName: 192.168.50.170:8080