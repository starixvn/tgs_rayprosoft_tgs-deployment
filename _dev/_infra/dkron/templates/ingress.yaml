apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dkron
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host}}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: dkron-web
                port: 
                  number: 8080