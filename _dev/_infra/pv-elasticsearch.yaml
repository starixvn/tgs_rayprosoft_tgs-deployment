apiVersion: v1
kind: PersistentVolume
metadata:
  name: elasticsearch-master-0
spec:
  storageClassName: manual
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: elastic-system
    name: elasticsearch-master-elasticsearch-master-0
  nfs:
    server: 192.168.50.111
    path: /nfsshare/elasticsearch/master0
---
