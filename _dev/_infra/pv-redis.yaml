## Redis 
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-data-master-0
spec:
  storageClassName: managed-nfs-storage
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: dev
    name: redis-data-redis-master-0
  nfs:
    server: 192.168.50.111
    path: /nfsshare/redis/dev/master
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-data-slave-0
spec:
  storageClassName: managed-nfs-storage
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: dev
    name: redis-data-redis-replicas-0
  nfs:
    server: 192.168.50.111
    path: /nfsshare/redis/dev/slave
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-data-slave-2
spec:
  storageClassName: managed-nfs-storage
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: dev
    name: redis-data-redis-replicas-2
  nfs:
    server: 192.168.50.111
    path: /nfsshare/redis/dev/slave-2
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-data-slave-1
spec:
  storageClassName: managed-nfs-storage
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: dev
    name: redis-data-redis-replicas-1
  nfs:
    server: 192.168.50.111
    path: /nfsshare/redis/dev/slave-1
---
