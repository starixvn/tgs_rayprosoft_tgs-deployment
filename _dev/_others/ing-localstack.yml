apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localstack
spec:
  ingressClassName: nginx
  rules:
  - host: localstack.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: localstack
            port: 
              number: 80