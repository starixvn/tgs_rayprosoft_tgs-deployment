apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: localstack
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  ingressClassName: nginx
  rules:
  - host: localstack.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          serviceName: localstack
          servicePort: 80