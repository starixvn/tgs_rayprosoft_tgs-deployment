apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: pgadmin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - pgadmin.rpgp.cc
    secretName: pgadmin.rpgp.cc
  rules:
  - host: pgadmin.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          serviceName: pgadmin-pgadmin4
          servicePort: 80