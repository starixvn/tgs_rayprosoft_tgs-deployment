apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-api
  namespace: dev
  labels:
    app: email-api
spec:
  selector:
    matchLabels:
      app: email-api
  replicas: 1
  minReadySeconds: 8 #狀態為可以最小秒數
  strategy:
    type: RollingUpdate #使用RollingUpdate類型, 可以保證佈署期間服務不中斷
    rollingUpdate:
      maxUnavailable: 1 #佈署期間允許最大停止pod數量(replicas)
      maxSurge: 2 #佈署期間允許最大建立pod數量(replicas)
  template:
    metadata:
      labels:
        app: email-api
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: email-api
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/email-api:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80   
---
apiVersion: v1
kind: Service
metadata: 
  name: email-api
  namespace: dev
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: email-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-email-api
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - email.rpgp.cc
    secretName: rpgp.cc
  rules:
  - host: email.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: email-api
            port: 
              number: 80
