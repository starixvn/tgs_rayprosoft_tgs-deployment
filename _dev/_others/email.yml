apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-api
  namespace: dev
  labels:
    app: email-api
spec:
  selector:
    matchLabels:
      app: email-api
  replicas: 1
  minReadySeconds: 8 #狀態為可以最小秒數
  strategy:
    type: RollingUpdate #使用RollingUpdate類型, 可以保證佈署期間服務不中斷
    rollingUpdate:
      maxUnavailable: 1 #佈署期間允許最大停止pod數量(replicas)
      maxSurge: 2 #佈署期間允許最大建立pod數量(replicas)
  template:
    metadata:
      labels:
        app: email-api
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: email-api
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/email-api:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80   
---
apiVersion: v1
kind: Service
metadata: 
  name: email-api
  namespace: dev
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: email-api
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: certificate-email-api
  namespace: dev
spec:
  secretName: secret-email-api
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt
    kind: Issuer
    group: cert-manager.io
  dnsNames:
  - email.srvptt.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-email-api
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - email.srvptt.com
    secretName: secret-email-api
  rules:
  - host: email.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: email-api
            port: 
              number: 80
                        
                          