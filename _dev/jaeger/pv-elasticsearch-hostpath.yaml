apiVersion: v1
kind: PersistentVolume
metadata:
  name: elasticsearch-master-0
spec:
  storageClassName: manual
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: observability
    name: elasticsearch-master-elasticsearch-master-0
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /elasticsearch
---
