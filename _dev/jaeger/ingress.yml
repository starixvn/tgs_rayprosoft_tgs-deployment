apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: observability
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 220.132.206.70/32;
      deny all;
spec:
  ingressClassName: nginx
  rules: 
  - host: jaeger.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: jaeger-query
            port: 
              number: 80               