apiVersion: v1
kind: PersistentVolume
metadata:
  name: elasticsearch-data-0
spec:
  storageClassName: manual
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: observability
    name: data-elasticsearch-data-0
  nfs:
    server: 192.168.50.111
    path: /nfsshare/elasticsearch/data
---
