apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice-site
  namespace: dev
  labels:
    app: backoffice-site
    type: backend
spec:
  selector:
    matchLabels:
      app: backoffice-site
  replicas: 1
  minReadySeconds: 8 #狀態為可以最小秒數
  strategy:
    type: RollingUpdate #使用RollingUpdate類型, 可以保證佈署期間服務不中斷
    rollingUpdate:
      maxUnavailable: 1 #佈署期間允許最大停止pod數量(replicas)
      maxSurge: 2 #佈署期間允許最大建立pod數量(replicas)
  template:
    metadata:
      labels:
        app: backoffice-site
        type: backend
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: backoffice-site
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/backoffice-site:dev
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata: 
  name: backoffice-site
  namespace: dev
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: backoffice-site