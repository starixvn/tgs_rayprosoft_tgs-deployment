apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-email-api
  namespace: dev
data:
  appsettings.json: |
    {
      "EmailSetting": {
        "FromMail": "verifyme@163.com",
        "FromName": "TGS",
        "SmtpServer": "smtp.163.com",
        "Port": 25,
        "Password": "IAUSMDLMDZWJECBP"
      },
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      },
      "AllowedHosts": "*",
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-api
  namespace: dev
  labels:
    app: email-api
spec:
  selector:
    matchLabels:
      app: email-api
  replicas: 1
  template:
    metadata:
      labels:
        app: email-api
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: email-api
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/email-api:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80  
          volumeMounts:
            - mountPath: /app/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
      volumes:
        - name: appsettings
          configMap:
            name: configmap-email-api  
---
apiVersion: v1
kind: Service
metadata: 
  name: email-api
  namespace: dev
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: email-api
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: certificate-email-api
  namespace: dev
spec:
  secretName: secret-email-api
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt
    kind: Issuer
    group: cert-manager.io
  dnsNames:
  - email.srvptt.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-email-api
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - email.srvptt.com
    secretName: secret-email-api
  rules:
  - host: email.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: email-api
            port: 
              number: 80          