apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-game-haba
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: game-haba.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service: 
            name: game-haba
            port: 
              number: 80