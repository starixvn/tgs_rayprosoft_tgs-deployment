apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-sg
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - dev.game-sg.tgsdev.gq
    secretName: dev.game-sg.tgsdev.gq
  rules:
  - host: dev.game-sg.tgsdev.gq
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          serviceName: game-sg
          servicePort: 80