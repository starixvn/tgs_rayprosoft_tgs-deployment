apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-game-sg
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: dev.game-sg.tgsdev.gq
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-sg
            port: 
              number: 80