apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: viplevel-snapshotserver
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - viplevel-snapshotserver.rpgp.cc
    secretName: viplevel-snapshotserver.rpgp.cc
  rules:
  - host: viplevel-snapshotserver.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          serviceName: viplevel-snapshotserver
          servicePort: 80