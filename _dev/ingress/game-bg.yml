apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-game-bg
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: dev.game-bg.tgsdev.gq
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-bg
            port: 
              number: 80
  - host: game-bg.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          name: game-bg
          port: 
            number: 80