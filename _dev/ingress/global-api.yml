apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: global-api
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: global-api.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: global-api
            port: 
              number: 80