apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketing-report-daily-aggregate
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: marketing-report-daily-aggregate.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: marketing-report-daily-aggregate
            port:
              number: 80