apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-test
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/upstream-vhost: 192.68.50.44
    nginx.ingress.kubernetes.io/proxy-body-size: "5000m"
spec:
  rules:
  - host: payment.rpgp.cc
    http:
      paths:
      - backend:
          service:
            name: payment-test-asset
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: payment-test-asset
spec:
  ports:
  - name: app
    port: 80
    protocol: TCP
    targetPort: 5000
  clusterIP: None
  type: ClusterIP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: payment-test-asset
subsets:
- addresses:
  - ip: 192.168.50.44
  ports:
  - name: app
    port: 5000
    protocol: TCP