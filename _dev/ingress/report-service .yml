apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: report-service 
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
  - host: report-service.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: report-service 
            port: 
              number: 80