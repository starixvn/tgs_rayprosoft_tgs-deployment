apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-pluggableservice
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: game-pluggableservice.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /api/game-pluggable-service
        backend:
          service:
            name: game-pluggable-service 
            port:
              number: 80