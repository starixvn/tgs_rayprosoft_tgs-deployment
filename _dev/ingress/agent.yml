apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-agent
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - dev-agent.rpgp.cc
    secretName: dev-agent.rpgp.cc
  rules:
  - host: dev-agent.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: agent
            port: 
              number: 80
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: agent-api
            port: 
              number: 80