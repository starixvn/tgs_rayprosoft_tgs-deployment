apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-agent
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
  - host: dev-agent.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: agent
            port: 
              number: 80
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: agent-api
            port: 
              number: 80