apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-ab
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - game-ab.tgsdev.gq
    secretName: game-ab.tgsdev.gq
  rules:
  - host: game-ab.tgsdev.gq
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          serviceName: game-ab
          servicePort: 80