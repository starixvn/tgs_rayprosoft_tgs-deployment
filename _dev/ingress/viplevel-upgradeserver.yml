apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viplevel-upgradeserver
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - viplevel-upgradeserver.rpgp.cc
    secretName: viplevel-upgradeserver.rpgp.cc
  rules:
  - host: viplevel-upgradeserver.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: viplevel-upgradeserver
            port: 
              number: 80