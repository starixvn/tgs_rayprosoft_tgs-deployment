apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viplevel-upgradeserver
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: viplevel-upgradeserver.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: viplevel-upgradeserver
            port: 
              number: 80