apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-record-receiver
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: game-record-receiver.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-gamerecord-receiverserver 
            port: 
              number: 80