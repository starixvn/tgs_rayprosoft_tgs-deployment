apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: profit-rebate-service
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
  - host: profit-rebate-service.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: profit-rebate-service
            port: 
              number: 80