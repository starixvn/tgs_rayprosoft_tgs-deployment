apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-record-databaseserver
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
  - host: game-record-databaseserver.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-gamerecord-databaseserver
            port: 
              number: 80