apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-mocksite
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - dev-ms.rpgp.cc
    secretName: dev-ms.rpgp.cc
  rules:     
  - host: dev-ms.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          serviceName: operator-api
          servicePort: 80
      - pathType: Prefix
        path: /global-api
        backend:
          serviceName: global-api
          servicePort: 80
      - pathType: Prefix
        path: /
        backend:
          serviceName: mocksite
          servicePort: 80