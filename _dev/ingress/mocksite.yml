apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-mocksite
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:     
  - host: dev-ms.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: operator-api
            port:
              number: 80
      - pathType: Prefix
        path: /global-api
        backend:
          service:
            name: global-api
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: mocksite
            port:
              number: 80