apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-lobby-t1-test
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
  - host: dev-lobby-test.rpgp.cc
    http:
      paths:
      - path: /api/brandcommunication
        backend:
          service:
            name: brand-api
            port:
              number: 80
      - path: /api/brandlivechat
        backend:
          service:
            name: brand-api
            port:
              number: 80
      - path: /
        backend:
          service:
            name: lobby-t1
            port:
              number: 80
      - path: /api
        backend:
          service:
            name: operator-api
            port:
              number: 80