apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: game-gameproviders
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - game-gameproviders.rpgp.cc
    secretName: game-gameproviders.rpgp.cc
  rules:
  - host: game-gameproviders.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          serviceName: game-gameproviders
          servicePort: 80