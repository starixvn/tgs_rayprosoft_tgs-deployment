apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-gameproviders
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: game-gameproviders.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service
            name: game-gameproviders
            port: 
              number: 80