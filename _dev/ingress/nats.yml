apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nats
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
  - host: dev-nats.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: nats
            port:
              number: 8222