apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: game-record-scheduler
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - game-record-scheduler.rpgp.cc
    secretName: game-record-scheduler.rpgp.cc
  rules:
  - host: game-record-scheduler.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          serviceName: game-gamerecord-scheduler
          servicePort: 80