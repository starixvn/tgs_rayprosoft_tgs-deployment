apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-payment
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - host: dev-payment.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /leepay(/|$)(.*)
        backend:
          service:
            name: payment-leepay
            port:
              number: 80
      - pathType: Prefix
        path: /primepay(/|$)(.*)
        backend:
          service:
            name: payment-primepay
            port:
              number: 80
      - pathType: Prefix
        path: /applepay(/|$)(.*)
        backend:
          service:
            name: payment-applepay
            port:
              number: 80  
      - pathType: Prefix
        path: /umpay(/|$)(.*)
        backend:
          service:
            name: payment-umpay
            port:
              number: 80  
      - pathType: Prefix
        path: /maticpay(/|$)(.*)
        backend:
          service:
            name: payment-maticpay
            port:
              number: 80
      - pathType: Prefix
        path: /help2pay(/|$)(.*)
        backend:
          service:
            name: payment-help2pay
            port:
              number: 80
      - pathType: Prefix
        path: /skypay-vn(/|$)(.*)
        backend:
          service:
            name: payment-skypay
            port:
              number: 80
      - pathType: Prefix
        path: /skypay-cn(/|$)(.*)
        backend:
          service:
            name: payment-skypay
            port:
              number: 81