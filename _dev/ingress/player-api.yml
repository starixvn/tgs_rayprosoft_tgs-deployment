apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: player-api
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: dev-player-api.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: player-api
              number: 80