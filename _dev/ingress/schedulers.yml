apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-schedulers
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - dev-schedulers.rpgp.cc
    secretName: dev-schedulers.rpgp.cc
  rules:
  - host: dev-schedulers.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          serviceName: schedulers
          servicePort: 80