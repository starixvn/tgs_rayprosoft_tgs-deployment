apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-schedulers
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: dev-schedulers.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: schedulers
            port:
              number: 80