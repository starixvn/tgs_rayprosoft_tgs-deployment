apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-kickplayer
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: game-kickplayer.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-kickplayer-server
            port: 
              number: 80