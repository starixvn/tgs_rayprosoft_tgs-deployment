apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viplevel-databaseserver
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: viplevel-databaseserver.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: viplevel-databaseserver
            port:
              number: 80