apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viplevel-promotionserver
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: viplevel-promotionserver.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: viplevel-promotionserver
            port: 
              number: 80