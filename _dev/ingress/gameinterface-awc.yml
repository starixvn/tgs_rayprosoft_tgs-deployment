apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-gameinterface-awc-service
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
  - host: dev-game-awc.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-gameinterface-awc-service
            port: 
              number: 80