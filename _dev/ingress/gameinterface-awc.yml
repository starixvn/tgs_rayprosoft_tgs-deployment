apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-gameinterface-awc-service
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: dev-game-awc.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-gameinterface-awc-service
            port: 
              number: 80