apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-agent-api
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: agent-api.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: agent-api
            port: 
              number: 80