apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-backoffice
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Access-Control-Allow-Origin $http_origin;
spec:
  rules:  
  - host: dev-bo.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: backoffice-api
            port:
              number: 80
      - pathType: Prefix
        path: /fs
        backend:
          service:
            name: file-service
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: backoffice-site
            port:
              number: 80