apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-backoffice
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:  
  - host: dev-bo.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          serviceName: backoffice-api
          servicePort: 80
      - pathType: Prefix
        path: /fs
        backend:
          serviceName: file-service
          servicePort: 80
      - pathType: Prefix
        path: /
        backend:
          serviceName: backoffice-site
          servicePort: 80