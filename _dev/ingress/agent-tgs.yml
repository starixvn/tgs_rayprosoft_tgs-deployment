apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-agent-tgs
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: dev-agent.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: agent-api
            port: 
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service: 
            name: agent-tgs
            port: 
              number: 80