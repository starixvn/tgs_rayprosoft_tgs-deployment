apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-agent-tgs
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - dev-agent.rpgp.cc
    secretName: dev-agent-rpgp.cc
  rules:
  - host: dev-agent.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          serviceName: agent-api
          servicePort: 80
      - pathType: Prefix
        path: /
        backend:
          serviceName: agent-tgs
          servicePort: 80