apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ing-lobby-t5
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - dev-t5.rpgp.cc
    secretName: dev-t5.rpgp.cc
  rules:
  - host: dev-t5.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          serviceName: lobby-t5
          servicePort: 80
      - pathType: Prefix
        path: /api
        backend:
          serviceName: operator-api
          servicePort: 80