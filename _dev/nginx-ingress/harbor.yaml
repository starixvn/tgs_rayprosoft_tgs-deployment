apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 5000m
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Forwarded-For $http_x_forwarded_for";
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - harbor.rpgp.cc
    secretName: harbor.rpgp.cc
  rules:
  - host: harbor.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: harbor-assets
            port:
              name: app
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-assets
spec:
  ports:
  - name: app
    port: 443
    protocol: TCP
    targetPort: app
  type: ClusterIP
  clusterIP: None
---
apiVersion: v1
kind: Endpoints
metadata:
  name: harbor-assets
subsets:
- addresses:
  - ip: 192.168.50.126
  ports:
  - name: app
    port: 443
    protocol: TCP
