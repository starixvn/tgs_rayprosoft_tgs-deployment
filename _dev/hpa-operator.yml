apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-operator-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: operator-api
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50