apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-log-api
  namespace: dev
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "System.Net.Http.HttpClient": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      },
      "AllowedHosts": "*",
      "Notify": {
