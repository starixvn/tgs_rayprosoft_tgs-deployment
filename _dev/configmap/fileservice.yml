apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-fileservice
  namespace: dev
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      },
      "AllowedHosts": "*",
      "DatabaseSettings": {
        "ConnectionString": "mongodb://admin:abcd1234@192.168.50.111/filedb?retryWrites=true&w=majority&authSource=admin",
      },
      "NatsSetting": {
        "Urls": "nats://nats-client:4222",
        "ConnectTimeoutMs": 2000,
        "PingInterval": 5000,
        "PingMaxOutStanding": 3,
        "SubscriptionBatchSize": 128
      },
      "FileSetting": {
        "Path": "UploadImages",
        "FileSizeLimit": 2097152
      },
      "AWS": {
        "AccessKeyId": "test",
        "SecretAccessKey": "test",
        "Region": "ap-southeast-1",
        "UseHttp": true,
        "Project": {
          "ExternalServiceUrl": "https://localstack.tgsdev.gq",
          "ServiceUrl": "http://localstack.default:4566",
          "Bucket": "tgs-project"
        },
        "Secret": {
          "ExternalServiceUrl": "https://localstack.tgsdev.gq",
          "ServiceUrl": "http://localstack.default:4566",
          "Bucket": "tgs-secret"
        }
      }
    }