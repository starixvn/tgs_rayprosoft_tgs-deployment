apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: observability
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules: 
  - host: stg-kibana.rpgp.cc
    http:
      paths:
      - path: /
        backend:
          service:
            name: kibana-kibana
            port: 
              number: 5601               