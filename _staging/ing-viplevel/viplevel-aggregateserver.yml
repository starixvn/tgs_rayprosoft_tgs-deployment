apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viplevel-aggregateserver
spec:
  ingressClassName: nginx
  rules:
  - host: stg-viplevel-aggregateserver.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: viplevel-aggregateserver
            port:
              number: 80