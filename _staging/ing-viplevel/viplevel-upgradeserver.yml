apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viplevel-upgradeserver
spec:
  ingressClassName: nginx
  rules:
  - host: stg-viplevel-upgradeserver.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: viplevel-upgradeserver
            port: 
              number: 80