apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viplevel-queryserver
spec:
  ingressClassName: nginx
  rules:
  - host: stg-viplevel-queryserver.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: viplevel-queryserver
            port: 
              number: 80