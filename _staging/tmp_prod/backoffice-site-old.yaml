apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app: backoffice-api-old
    type: backend
  name: backoffice-api-old
  namespace: staging
spec:
  progressDeadlineSeconds: 600
  replicas: 5
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: backoffice-api-old
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8889"
        prometheus.io/scrape: "true"
      creationTimestamp: null
      labels:
        app: backoffice-api-old
        type: backend
    spec:
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: BackOffice-Api(prod)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: ConnectionStrings__Tgs
          valueFrom:
            secretKeyRef:
              key: tgs
              name: tgs-connections-prod
        - name: ConnectionStrings__RedisConfigurationString
          valueFrom:
            secretKeyRef:
              key: redis
              name: tgs-connections-prod
        - name: NatsSetting__Urls
          valueFrom:
            secretKeyRef:
              key: nats
              name: tgs-connections-prod
        - name: STAKATER_TGS_CONNECTIONS_SECRET
          value: 78dc1130496b642e3dbcd0061742dd96da0b70c9
        - name: STAKATER_CONFIGMAP_BACKOFFICE_API_CONFIGMAP
          value: 59e87c1adffba3a7bc10216102f7db0e1227f236
        image: pgtgs/backoffice-api:202310240531.590
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 80
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: backoffice-api
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 1600Mi
          requests:
            cpu: 500m
            memory: 1600Mi
        securityContext: {}
        startupProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 80
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config/appsettings.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
        - mountPath: /diag
          name: diagvol
        - mountPath: /dumps
          name: dumpsvol
      - args:
        - --config=/etc/otel/config.yaml
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        image: otel/opentelemetry-collector:0.62.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: health
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        name: monitor
        ports:
        - containerPort: 8889
          name: metrics
          protocol: TCP
        - containerPort: 13133
          name: health
          protocol: TCP
        - containerPort: 4317
          name: otlp
          protocol: TCP
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 32Mi
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: health
            scheme: HTTP
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/otel/config.yaml
          name: appsettings
          readOnly: true
          subPath: otel-collector-config.yaml
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub
      nodeSelector:
        dedicated: staging
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: staging
      volumes:
      - configMap:
          defaultMode: 420
          name: configmap-backoffice-api
        name: appsettings
      - emptyDir: {}
        name: diagvol
      - emptyDir: {}
        name: dumpsvol
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    healthChecksPath: /health
  labels:
    app: backoffice-api-old
    healthCheck: enabled
  name: backoffice-api-old
  namespace: staging
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: backoffice-api-old
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  name: backoffice-site-old
  namespace: staging
spec:
  ingressClassName: nginx
  rules:
  - host: old.criop668.com
    http:
      paths:
      - backend:
          service:
            name: backoffice-api-old
            port:
              number: 80
        path: /api
        pathType: ImplementationSpecific
      - backend:
          service:
            name: file-service
            port:
              number: 80
        path: /fs
        pathType: ImplementationSpecific
      - backend:
          service:
            name: backoffice-site
            port:
              number: 80
        path: /
        pathType: ImplementationSpecific
