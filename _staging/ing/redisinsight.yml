apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  name: redisinsight
  namespace: staging
spec:
  ingressClassName: nginx
  rules:
  - host: stg2-redisinsight.rpgp.cc
    http:
      paths:
      - backend:
          service:
            name: redisinsight-redisinsight-chart
            port:
              number: 80
        path: /
        pathType: Prefix