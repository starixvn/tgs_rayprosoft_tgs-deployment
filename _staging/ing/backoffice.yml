apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-tgs-backoffice
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
  - hosts:
    - stg-bo.rpgp.cc
    secretName: stg-bo.rpgp.cc
  rules:    
  - host: stg-bo.rpgp.cc
    http:
      paths:
      - path: /api
        backend:
          serviceName: backoffice-api
          servicePort: 80  
      - path: /fs
        backend:
          serviceName: file-service
          servicePort: 80  
      - path: /
        backend:
          serviceName: backoffice-site
          servicePort: 80