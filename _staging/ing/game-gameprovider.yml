apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: game-gameproviders
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - stg-gameproviders.rpgp.cc
    secretName: stg-gameproviders.rpgp.cc
  rules:
  - host: stg-gameproviders.rpgp.cc
    http:
      paths:
      - path: /
        backend:
          serviceName: game-gameproviders
          servicePort: 80