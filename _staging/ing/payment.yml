apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-payment
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: stg-payment.rpgp.cc
      http:
        paths:
          - backend:
              service:
                name: payment-leepay
                port:
                  number: 80
            path: /leepay(/|$)(.*)
            pathType: ImplementationSpecific
          - backend:
              service:
                name: payment-primepay
                port:
                  number: 80
            path: /primepay(/|$)(.*)
            pathType: ImplementationSpecific
          - backend:
              service:
                name: payment-applepay
                port:
                  number: 80
            path: /applepay(/|$)(.*)
            pathType: ImplementationSpecific
          - backend:
              service:
                name: payment-umpay
                port:
                  number: 80
            path: /umpay(/|$)(.*)
            pathType: ImplementationSpecific
          - backend:
              service:
                name: payment-maticpay
                port:
                  number: 80
            path: /maticpay(/|$)(.*)
            pathType: ImplementationSpecific
          - backend:
              service:
                name: payment-help2pay
                port:
                  number: 80
            path: /help2pay(/|$)(.*)
            pathType: ImplementationSpecific
          - backend:
              service:
                name: payment-skypay
                port:
                  number: 80
            path: /skypay-vn(/|$)(.*)
            pathType: ImplementationSpecific
          - backend:
              service:
                name: payment-skypay
                port:
                  number: 81
            path: /skypay-cn(/|$)(.*)
            pathType: ImplementationSpecific
          - backend:
              service:
                name: payment-zeronineninepay
                port:
                  number: 80
            path: /zeronineninepay(/|$)(.*)
            pathType: ImplementationSpecific
          - backend:
              service:
                name: payment-tupay
                port:
                  number: 80
            path: /tupay(/|$)(.*)
            pathType: ImplementationSpecific
          - backend:
              service:
                name: payment-malakipay
                port:
                  number: 80
            path: /malakipay(/|$)(.*)
            pathType: ImplementationSpecific
