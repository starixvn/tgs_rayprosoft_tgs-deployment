apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-payment
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  tls:
  - hosts:
    - stg-payment.rpgp.cc
    secretName: stg-payment.rpgp.cc
  rules:
  - host: stg-payment.rpgp.cc
    http:
      paths:
      - path: /leepay(/|$)(.*)
        backend:
          serviceName: payment-leepay
          servicePort: 80
      - path: /primepay(/|$)(.*)
        backend:
          serviceName: payment-primepay
          servicePort: 80
      - path: /applepay(/|$)(.*)
        backend:
          serviceName: payment-applepay
          servicePort: 80
      - path: /umpay(/|$)(.*)
        backend:
          serviceName: payment-umpay
          servicePort: 80
      - path: /maticpay(/|$)(.*)
        backend:
          serviceName: payment-maticpay  
          servicePort: 80
      - path: /help2pay(/|$)(.*)
        backend:
          serviceName: payment-help2pay
          servicePort: 80
      - path: /skypay-vn(/|$)(.*)
        backend:
          serviceName: payment-skypay
          servicePort: 80
      - path: /skypay-cn(/|$)(.*)
        backend:
          serviceName: payment-skypay
          servicePort: 81