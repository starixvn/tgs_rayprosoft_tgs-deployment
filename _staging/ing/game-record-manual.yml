apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-record-manual-service
  namespace: staging
spec:
  ingressClassName: nginx
  rules:
  - host: stg-gamerecord-manual.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-gamerecord-manual-service
            port: 
              number: 80