apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-gamerecord-awc-scheduleservice
  namespace: staging
spec:
  ingressClassName: nginx
  rules:
  - host: stg-game-awc-scheduler.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-gamerecord-awc-scheduleservice
            port: 
              number: 80