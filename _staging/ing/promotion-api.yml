apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promotion-api
  namespace: staging
spec:
  ingressClassName: nginx
  rules:
  - host: promotion-api.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: promotion-api
            port: 
              number: 80