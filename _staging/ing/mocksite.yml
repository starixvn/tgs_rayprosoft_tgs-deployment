apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-mocksite
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - stg-ms.rpgp.cc
    secretName: stg-ms.rpgp.cc
  rules:        
  - host: stg-ms.rpgp.cc
    http:
      paths:
      - path: /api
        backend:
          serviceName: operator-api
          servicePort: 80  
      - path: /global-api
        backend:
          serviceName: global-api
          servicePort: 80  
      - path: /
        backend:
          serviceName: mocksite
          servicePort: 80  