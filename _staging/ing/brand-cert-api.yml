apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  labels:
    app.kubernetes.io/name: brand-cert-api
    tgs.kind: brand
  name: brand-cert-api
  namespace: staging
spec:
  ingressClassName: nginx
  rules:
  - host: stg-brand-cert.rpgp.cc
    http:
      paths:
      - backend:
          service:
            name: brand-cert-api
            port:
              number: 80
        path: /
        pathType: Prefix