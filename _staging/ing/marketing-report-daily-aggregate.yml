apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketing-report-daily-aggregate
  namespace: staging
spec:
  ingressClassName: nginx
  rules:
  - host: stg-marketing-report-daily-aggregate.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: marketing-report-daily-aggregate
            port: 
              number: 80