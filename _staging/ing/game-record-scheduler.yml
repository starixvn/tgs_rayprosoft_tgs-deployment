apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: game-record-scheduler
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - stg-record-scheduler.rpgp.cc
    secretName: stg-record-scheduler.rpgp.cc
  rules:
  - host: stg-record-scheduler.rpgp.cc
    http:
      paths:
      - path: /
        backend:
          serviceName: game-gamerecord-scheduler
          servicePort: 80