apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lobby-tiger-landing
  namespace: staging
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: landing.hktiger888.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: lobby-tiger-landing
            port: 
              number: 80