apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-dsite
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
  - host: agent-t1.pgdemo.online
    http:
      paths:
      - pathType: Prefix
        path: /api/brandcommunication
        backend:
          service:
            name: agent-dsite
            port: 
              number: 80