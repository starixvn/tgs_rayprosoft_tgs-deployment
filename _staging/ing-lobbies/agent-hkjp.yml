apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-agent-hkjp
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - stg.we8889.com
    secretName: stg.we8889.com
  rules:
  - host: stg.we8889.com
    http:
      paths:
      - path: /api
        backend:
          serviceName: agent-api
          servicePort: 80
      - path: /
        backend:
          serviceName: agent-hkjp
          servicePort: 80