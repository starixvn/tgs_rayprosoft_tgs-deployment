apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: agent-tgs689
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - stg-agent-tgs689.rpgp.cc
    secretName: stg-agent-tgs689.rpgp.cc
  rules:
  - host: stg-agent-tgs689.rpgp.cc
    http:
      paths:
      - path: /api
        backend:
          serviceName: agent-api
          servicePort: 80
      - path: /
        backend:
          serviceName: agent-tgs689
          servicePort: 80