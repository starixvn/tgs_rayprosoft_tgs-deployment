# https://cloud.tencent.com/document/product/1416/56038
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: monitoring
  labels:
    app: postgres
    app.kubernetes.io/name: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgresql
    spec:
      containers:
      - name: postgres-exporter
        image: quay.io/prometheuscommunity/postgres-exporter:latest
        args:
          - "--web.listen-address=:9187"
          - "--log.level=debug"
        env:
          - name: DATA_SOURCE_USER
            valueFrom:
              secretKeyRef:
                name: postgres-exporter
                key: username
          - name: DATA_SOURCE_PASS
            valueFrom:
              secretKeyRef:
                name: postgres-exporter
                key: password
          - name: DATA_SOURCE_URI
            value: db-staging.cglu874fh5rb.ap-east-1.rds.amazonaws.com:5432/postgres?sslmode=disable"
        ports:
        - name: http-metrics
          containerPort: 9187
---
apiVersion: v1
kind: Service
metadata: 
  name: postgres-exporter
  namespace: monitoring
spec: 
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9187
      name: api
  selector:
      app: postgres
---
apiVersion: v1
kind: Secret
metadata:
    name: postgres-exporter
    namespace: monitoring
type: Opaque
stringData:
    username: tgs_monitor
    password: 29HVdYXrXrVtGT3