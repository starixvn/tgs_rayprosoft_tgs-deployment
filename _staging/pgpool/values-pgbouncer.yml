replicaCount: 1
verbose: 1
users:
  dbuser: postgres
databases:
  postgres:
    host: db-production.cglu874fh5rb.ap-east-1.rds.amazonaws.com
    port: 5432
    user: postgres
    dbname: tgsstaging
connectionLimits:
  defaultPoolSize: 20
  minPoolSize: 20
  reservePoolSize: 20
service:
  enabled: true
  type: ClusterIP
  name: "pgbouncer"
  annotations: {}