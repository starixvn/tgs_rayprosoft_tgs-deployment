kind: Deployment
apiVersion: apps/v1
metadata:
  name: lobby-m9thb
  namespace: staging
  labels:
    app: lobby-m9thb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-m9thb
  template:
    metadata:
      labels:
        app: lobby-m9thb
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: nonprod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: nonprod
      containers:
        - name: lobby-m9thb
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t3:staging
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "SC8CfwKitkbbdicsk4AZFdOsdbeXet1ZqMAJSL05Q4RkJejNSI0u0M"
          - name: CURRENCY
            value: "THB"
          - name: BRAND
            value: "M9THB"
          - name: BRANDNAME
            value: "M9THB"
          - name: THEME
            value: "black"
          - name: "WAPTEMPLATE"
            value: "3"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          - name: HOMEPAGE
            value: "[\"t3-1\",\"t3-2\",\"t3-3\"]"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 150m
              memory: 300Mi
            requests:
              cpu: 150m
              memory: 300Mi
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-m9thb
  namespace: staging
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: lobby-m9thb