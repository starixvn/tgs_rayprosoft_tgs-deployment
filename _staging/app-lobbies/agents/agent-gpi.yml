apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-gpi
  labels:
    type: frontend
    app: agent-gpi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-gpi
  template:
    metadata:
      labels:
        type: frontend
        app: agent-gpi
    spec:
      imagePullSecrets:
        - name: registry-credentials
        - name: dockerhub
      securityContext:
        {}
      nodeSelector:
        dedicated: staging
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: staging
      containers:
        - name: agent-gpi
          securityContext:
            {}
          image: "pgtgs/agent:2023.05.05.0849.staging"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
          - name: CLIENT
            value: "pB5v0g6NSbyHQxjZqdYF43LlJOXSoaoKM3SdymWlR4UT5bQyhgc5H2"
          - name: CURRENCY
            value: "HKD"
          - name: BRAND
            value: "SKY8"
          - name: SITE
            value: "http://pcclub88.com/"
          - name: THEME
            value: "red"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "zh-TW"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            limits:
              cpu: 50m
              memory: 100Mi
            requests:
              cpu: 20m
              memory: 30Mi