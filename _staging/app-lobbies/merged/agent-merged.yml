          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 80 2080"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: "I7nKiimrZQOqnJ6ryjUw74c0Hi64KC6Myunhob4cHh8VOUIuZh4p63czefxyyzbZ"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "PGG"
          - name: SITE
            value: "https://stg-t1.rpgp.cc/"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
