kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: staging
  name: agent-merged
  labels:
    app: agent-merged
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: agent-merged
  template:
    metadata:
      labels:
        app: agent-merged
    spec:
      imagePullSecrets:
        - name: registry-credentials
      volumes:
        - name: bash-frontend
