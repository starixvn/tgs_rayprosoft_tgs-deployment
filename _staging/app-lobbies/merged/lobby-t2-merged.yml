kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: dev
  name: lobby-t2-merged
  labels:
    app: lobby-t2-merged
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: lobby-t2-merged
  template:
    metadata:
      labels:
        app: lobby-t2-merged
    spec:
      imagePullSecrets:
        - name: registry-credentials
      volumes:
        - name: bash-frontend
          configMap:
            name: bash-frontend
            defaultMode: 0777
      containers:
        - name: lobby-gpi-t2
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t2:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 80 2080"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: I7nKiimrZQOqnJ6ryjUw74c0Hi64KC6Myunhob4cHh8VOUIuZh4p63czefxyyzbZ
          - name: CURRENCY
            value: CNY
          - name: BRAND
            value: PGG
          - name: DEFAULT_LANGUAGE
            value: zh-CN
          - name: THEME
            value: red
          - name: SOURCE_URL
            value: https://images.srvptt.com/ 
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: lobby-demo-t2
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t2:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 81 2081"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: D8lud4V5gN3RP9wCDpCIrgZEk09cfTKRJf8ghfZtGUaIiJJph3E4WM
          - name: CURRENCY
            value: CNY
          - name: BRAND
            value: PGG
          - name: DEFAULT_LANGUAGE
            value: zh-CN
          - name: THEME
            value: red
          - name: SOURCE_URL
            value: https://images.srvptt.com/
          ports:
            - containerPort: 81
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 81
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: lobby-bunny
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t2:merged
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args: ["-c", "/srv/bash-frontend.sh 82 2082"]
          volumeMounts:
            - mountPath: /srv/bash-frontend.sh
              name: bash-frontend
              readOnly: true
              subPath: bash-frontend
          env:
          - name: CLIENT
            value: VWQVAd0teQR3XBk7D618pgeWjCRI2mJr2VqvJXpJIAsKkl3ohGIlSa
          - name: CURRENCY
            value: PHP
          - name: BRAND
            value: stg_BUNNY
          - name: BRANDNAME
            value: BUNNY
          - name: DEFAULT_LANGUAGE
            value: en-US
          - name: THEME
            value: red
          - name: SOURCE_URL
            value: https://images.srvptt.com/
          ports:
            - containerPort: 82
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 82
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 82
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5