kind: Deployment
apiVersion: apps/v1
metadata:
  name: lobby-gmo
  namespace: staging
  labels:
    app: lobby-gmo
    type: lobby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-gmo
  template:
    metadata:
      labels:
        app: lobby-gmo
        type: lobby
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: nonprod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: nonprod
      containers:
        - name: lobby-gmo
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t1:staging
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "XJY9uX5RarE5wrOkTHAgkQoGKMuNFxKIXF4A6zR4BfgCHNs1tC7zDv"
          - name: CURRENCY
            value: "HKD"
          - name: BRAND
            value: "GMO"
          - name: BRANDNAME
            value: "GMO"
          - name: DEFAULT_LANGUAGE
            value: "zh-TW"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 10m
              memory: 60Mi
            requests:
              cpu: 2m
              memory: 12Mi
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-gmo
  namespace: staging
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: lobby-gmo