kind: Deployment
apiVersion: apps/v1
metadata:
  name: lobby-m9th
  namespace: staging
  labels:
    app: lobby-m9th
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-m9th
  template:
    metadata:
      labels:
        app: lobby-m9th
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: nonprod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: nonprod
      containers:
        - name: lobby-m9th
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t1:staging
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "U5cbsZdVYCPtYKFJPLOsJCxaLM4Hz2WoshAtM6MgjDiujrXlOOgV0c"
          - name: CURRENCY
            value: "THB"
          - name: BRAND
            value: "M9TH"
          - name: BRANDNAME
            value: "M9TH"
          - name: DEFAULT_LANGUAGE
            value: "en-US"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 150m
              memory: 300Mi
            requests:
              cpu: 150m
              memory: 300Mi
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-m9th
  namespace: staging
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: lobby-m9th