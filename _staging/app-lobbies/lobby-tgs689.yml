kind: Deployment
apiVersion: apps/v1
metadata:
  name: lobby-tgs689
  namespace: staging
  labels:
    app: lobby-tgs689
    type: lobby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-tgs689
  template:
    metadata:
      labels:
        app: lobby-tgs689
        type: lobby
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: nonprod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: nonprod
      containers:
        - name: lobby-tgs689
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t3:staging
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "CVgeg0GeB5fxXaNP8t6QRrYaNOIjLraa9bCWbJxyqtpDehHjXi4nR3"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "TGS689"
          - name: THEME
            value: "black"
          - name: "WAPTEMPLATE"
            value: "4"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          - name: HOMEPAGE
            value: "[\"t4-1\",\"t4-2\",\"t4-3\",\"t4-4\"]"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 10m
              memory: 60Mi
            requests:
              cpu: 2m
              memory: 12Mi
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-tgs689
  namespace: staging
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: lobby-tgs689
