kind: Deployment
apiVersion: apps/v1
metadata:
  name: lobby-gp-test
  namespace: staging
  labels:
    app: lobby-gp-test
    type: lobby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-gp-test
  template:
    metadata:
      labels:
        app: lobby-gp-test
        type: lobby
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: nonprod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: nonprod
      containers:
        - name: lobby-gp-test
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t1:staging
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "fZWK4eiXGxpywltZyKtnrrJr5zBgAyEQoXwPbyK0dVWKRVJOZNLQUn"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "PGG"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: BANNER_COUNT
            value: "2"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 10m
              memory: 60Mi
            requests:
              cpu: 2m
              memory: 12Mi
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-gp-test
  namespace: staging
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: lobby-gp-test