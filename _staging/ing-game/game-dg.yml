apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-game-dg
  namespace: staging
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 220.132.206.70/32;
      deny all;
spec:
  ingressClassName: nginx
  rules: 
  - host: game-dg.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-dg
            port: 
              number: 80