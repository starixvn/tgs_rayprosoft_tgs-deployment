apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-game-dg
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - game-dg.rpgp.cc
    secretName: game-dg.rpgp.cc
  rules: 
  - host: game-dg.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-dg
            port: 
              number: 80