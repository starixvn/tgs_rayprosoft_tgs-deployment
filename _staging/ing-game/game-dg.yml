apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-game-dg
  namespace: staging
spec:
  ingressClassName: nginx
  rules: 
  - host: game-dg.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-dg
            port: 
              number: 80