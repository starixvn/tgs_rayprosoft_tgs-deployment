apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-imes
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 134.159.170.30/32;  
      allow 220.132.206.70/32;
      deny all;
spec:
  # tls:
  # - hosts:
    # - game-imes.yydsgo.xyz
    # secretName: game-imes.yydsgo.xyz
  rules: 
  - host: game-imes.rpgp.cc
    http:
      paths:
      - path: /
        backend:
          serviceName: game-imes
          servicePort: 80