apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-evo
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 35.194.204.27/32;
      allow 220.132.206.70/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-evo.rpgp.cc
    secretName: game-evo.rpgp.cc
  rules: 
  - host: game-evo.rpgp.cc
    http:
      paths:
      - path: /
        backend:
          serviceName: game-evo
          servicePort: 80