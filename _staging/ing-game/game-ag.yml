apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-ag
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 138.43.195.21;
      allow 207.174.191.119;
      allow 220.132.206.70/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-ag.rpgp.cc
    secretName: game-ag.rpgp.cc
  rules: 
  - host: game-ag.rpgp.cc
    http:
      paths:
      - path: /
        backend:

          serviceName: game-ag
          servicePort: 80