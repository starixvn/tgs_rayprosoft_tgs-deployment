apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-sw
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 49.128.84.50/32;
      allow 49.128.94.21/32;
      allow 49.128.94.22/32;
      allow 35.201.172.60/32;
      allow 35.185.135.227/32;
      allow 220.132.206.70/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-sw.rpgp.cc
    secretName: game-sw.rpgp.cc
  rules:
  - host: game-sw.rpgp.cc
    http:
      paths:
      - path: /
        backend:
          serviceName: game-sw
          servicePort: 80