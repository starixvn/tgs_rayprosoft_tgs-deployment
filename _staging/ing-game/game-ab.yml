apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-ab
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 40.74.71.228/32;
      allow 40.74.68.11/32;
      allow 13.75.42.143/32;
      allow 220.132.206.70/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-ab.rpgp.cc
    secretName: game-ab.rpgp.cc
  rules: 
  - host: game-ab.rpgp.cc
    http:
      paths:
      - path: /
        backend:
          serviceName: game-ab
          servicePort: 80