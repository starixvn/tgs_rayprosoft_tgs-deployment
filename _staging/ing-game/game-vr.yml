apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-vr
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - game-vr.rpgp.cc
    secretName: game-vr.rpgp.cc
  rules: 
  - host: game-vr.rpgp.cc
    http:
      paths:
      - path: /
        backend:
          serviceName: game-vr
          servicePort: 80   