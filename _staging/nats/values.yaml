metrics:
  enabled: true
auth:
  enabled: false
# global:
  # labels: 
    # velero.io/exclude-from-backup: "true"
cluster:
  enabled: true
  name: nats

nats:
  gomemlimit: "50MiB"
  jetstream:
    enabled: true
    memStorage:
      enabled: false
    fileStorage:
      enabled: true
      size: 10Gi
      storageClassName: gp2

nodeSelector:
  dedicated: staging
tolerations:
- effect: NoSchedule
  key: dedicated
  operator: Equal
  value: staging

