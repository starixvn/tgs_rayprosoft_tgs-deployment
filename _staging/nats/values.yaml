metrics:
  enabled: true
auth:
  enabled: false
# global:
  # labels: 
    # velero.io/exclude-from-backup: "true"
cluster:
  enabled: true
  name: nats

nats:
  gomemlimit: "50MiB"
  jetstream:
    enabled: true
    memStorage:
      enabled: false
    fileStorage:
      enabled: true
      size: 30Gi
      storageClassName: gp2

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - nats
        topologyKey: "kubernetes.io/hostname"
