{{- if .Values.createUserJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: create-mongodb-user
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "mongodb.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  template:
    spec:
      containers:
      - name: create-user
        image: bitnami/mongodb:latest
        command:
        - /bin/sh
        - -c
        - |
          until mongosh --host {{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local --eval "print(\"waiting for connection\")"; do
            sleep 5
          done
          
          echo "user: {{ .Values.createUserJob.user }}"
          echo "password: {{ .Values.createUserJob.password }}"
          echo "roles: {{ .Values.createUserJob.roles }}"
          
          mongosh --host {{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local --eval 'db.getSiblingDB("admin").createUser({
              user: "{{ .Values.createUserJob.user }}",
              pwd: "{{ .Values.createUserJob.password }}",
              roles: {{ .Values.createUserJob.roles | toJson }}
            });
            '
      restartPolicy: OnFailure
{{- end }}
