## helm repo add bitnami https://charts.bitnami.com/bitnami
## helm upgrade -i mongodb bitnami/mongodb -f values-mongo.yaml -n staging
## helm template mongodb bitnami/mongodb -f values-mongo.yaml -n staging
global:
  storageClass: gp2
metrics:
  enabled: true
auth:
  rootPassword: 1qaz2wsx
  enabled: false
image:
  tag: 5.0.9-debian-11-r3
nodeSelector: {}
tolerations: []
## https://chatgpt.com/c/62ddad0e-3881-4581-904a-216391148f59
extraInitContainers: |
  - name: create-mongodb-user
    image: bitnami/mongodb:latest
    command: ['sh', '-c', 'until mongosh --host mongodb.staging.svc.cluster.local --eval "print(\"waiting for connection\")"; do sleep 5; done; mongosh --host mongodb.staging.svc.cluster.local --eval "db.createUser({user:\"root\", pwd:\"1qaz2wsx\", roles:[{role:\"dbOwner\", db:\"admin\"}]})"']
    env:
      - name: MONGO_INITDB_ROOT_USERNAME
        value: "root"
      - name: MONGO_INITDB_ROOT_PASSWORD
        value: "1qaz2wsx"
    volumeMounts:
      - name: data
        mountPath: /data/db
