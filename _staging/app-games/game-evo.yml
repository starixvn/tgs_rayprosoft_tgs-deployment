apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-evo
  namespace: staging
  labels:
    app: game-evo
spec:
  selector:
    matchLabels:
      app: game-evo
  replicas: 1
  template:
    metadata:
      labels:
        app: game-evo
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: nonprod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: nonprod
      containers:
        - name: game-evo
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/tgs-api:staging
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 500Mi
          ports:
            - containerPort: 80
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          env:
            - name: aspnetcore_environment
              value: "Staging"
            - name: aspnetcore_https_port
              value: "443"
            - name: GameProviderCode
              value: "EVO"
          volumeMounts:
            - mountPath: /app/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
      volumes:
        - name: appsettings
          configMap:
            name: configmap-game-evo
---
apiVersion: v1
kind: Service
metadata: 
  name: game-evo
  namespace: staging
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: game-evo
                
                        
                          
