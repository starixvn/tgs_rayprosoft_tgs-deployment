controller:
  config: 
    hsts: false
    allow-snippet-annotations: "true"
    otlp-collector-host: otel-svc.observability
    enable-opentelemetry: "true"
    opentelemetry-operation-name: "HTTP $request_method $uri"
    otel-service-name: nginx-ingress-controller
    access-log-path: /var/log/nginx/nginx_access.log
    error-log-path: /var/log/nginx/nginx_error.log
    forwarded-for-header: X-Forwarded-For
    compute-full-forwarded-for: "true"
    enable-real-ip: "true"
    log-format-upstream: '{"@timestamp": "$time_iso8601","remote_addr": "$remote_addr","referer": "$http_referer","request": "$request","status": $status,"bytes": $body_bytes_sent,"agent": "$http_user_agent","x_forwarded": "$http_x_forwarded_for","up_addr": "$upstream_addr","up_host": "$upstream_http_host","up_resp_time": "$upstream_response_time","request_time": "$request_time"}'
    use-forwarded-headers: "true"
    server-snippet: |
      real_ip_header CF-Connecting-IP;
  opentelemetry: 
    enabled: true
  service: 
    type: NodePort
    nodePorts:
      http: 30486
      https: 30462
  metrics:
    enabled: "true"
    service:
      annotations:
        prometheus.io/port: "10254"
        prometheus.io/scrape: "true"
