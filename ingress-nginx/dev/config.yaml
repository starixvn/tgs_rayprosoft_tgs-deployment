controller:
  config: 
    hsts: false
    otlp-collector-host: otel-svc.observability
    enable-opentelemetry: "true"
  opentelemetry: 
    enabled: true
  service: 
    type: NodePort
    nodePorts:
      http: 30486
      https: 30462
  metrics:
    service:
      annotations:
        prometheus.io/port: 10254
        prometheus.io/scrape: true