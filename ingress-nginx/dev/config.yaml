controller:
  config: 
    hsts: false
    allow-snippet-annotations: "true"
    otlp-collector-host: otel-svc.observability
    enable-opentelemetry: "true"
    opentelemetry-operation-name: "HTTP $request_method $uri"
    otel-service-name: nginx-ingress-controller
    forwarded-for-header: X-Forwarded-For
    compute-full-forwarded-for: "true"
    enable-real-ip: "true"
    log-format-upstream: '{"@timestamp": "$time_iso8601","remote_ip": "$remote_addr","host": "$http_referer","path": "$request","status": $status,"bytes": $body_bytes_sent,"device": "$http_user_agent","client_ip": "$http_x_forwarded_for","proxy_pass_to": "$upstream_addr","up_host": "$upstream_http_host","proxy_pass_respone_time": "$upstream_response_time","request_time": "$request_time"}'
    server-snippet: |
      real_ip_header CF-Connecting-IP;
  opentelemetry: 
    enabled: true
  service: 
    type: NodePort
    nodePorts:
      http: 30486
      https: 30462
  metrics:
    enabled: "true"
    service:
      annotations:
        prometheus.io/port: "10254"
        prometheus.io/scrape: "true"
