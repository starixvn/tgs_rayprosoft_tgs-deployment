controller:
  config:
    hsts: false
    otlp-collector-host: otel-svc.observability
    enable-opentelemetry: "true"
  opentelemetry:
    enabled: true
  service:
    type: LoadBalancer
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/port: 10254
        prometheus.io/scrape: true
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 2
      memory: 4Gi
