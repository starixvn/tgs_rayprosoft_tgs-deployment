apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-check-alert
  namespace: prod
spec:
  concurrencyPolicy: Forbid
  schedule: '*/5 * * * *'
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 28800
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: deployment-restart
          restartPolicy: Never
          containers:
            - name: kubectl
              image: bitnami/kubectl
              command:
                - bash
                - -c
                - >-
                   kubectl -n prod rollout restart deployment viplevel-snapshot