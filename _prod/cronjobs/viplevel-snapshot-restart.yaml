apiVersion: batch/v1
kind: CronJob
metadata:
  name: viplevel-snapshot-restart
  namespace: prod
spec:
  concurrencyPolicy: Forbid
  schedule: '45 2 * * *' # cron spec of time, here, 8 o'clock
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 28800
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: deployment-restart
          restartPolicy: Never
          containers:
            - name: kubectl
              image: bitnami/kubectl
              command:
                - bash
                - -c
                - >-
                   kubectl -n prod rollout restart viplevel-snapshot