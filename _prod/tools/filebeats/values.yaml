image: docker.elastic.co/beats/filebeat-oss
imageTag: 7.10.0

filebeatConfig:
  filebeat.yml: |
    filebeat.inputs:
    - type: docker
      multiline.pattern: '^[[:space:]]'
      multiline.negate: false
      multiline.match: after
      containers.ids:
        - '*'
      processors:
      - add_kubernetes_metadata:
          in_cluster: true

    output.logstash:
      hosts: ["logstash-headless:10514"]
tolerations:
- operator: Exists


