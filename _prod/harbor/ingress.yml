apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor
  namespace: harbor
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - harbor.srvptt.com
    secretName: harbor.srvptt.com
  rules:
  - host: harbor.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: harbor-portal
            port: 
              number: 443