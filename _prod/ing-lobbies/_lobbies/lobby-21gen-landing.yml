apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: lobby-21gen-landing
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - 21gen.com
    secretName: 21gen.com
  - hosts:
    - www.21gen.com
    secretName: www.21gen.com
  rules:
  - host: 21gen.com
    http:
      paths:
      - path: /api
        backend:
          serviceName: operator-api
          servicePort: 80
      - path: /
        backend:
          serviceName: lobby-21gen-landing
          servicePort: 80
  - host: www.21gen.com
    http:
      paths:
      - path: /api
        backend:
          serviceName: operator-api
          servicePort: 80
      - path: /
        backend:
          serviceName: lobby-21gen-landing
          servicePort: 80