apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: agent-mess8
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - agent.mess888.com
    secretName: agent.mess888.com
  rules:
  - host: agent.mess888.com
    http:
      paths:
      - path: /api
        backend:
          serviceName: agent-api
          servicePort: 80
      - path: /
        backend:
          serviceName: agent-mess8
          servicePort: 80