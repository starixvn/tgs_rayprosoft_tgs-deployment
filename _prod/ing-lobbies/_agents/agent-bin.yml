apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-agent-bin
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - agent.mybingo.fun
    secretName: agent.mybingo.fun
  rules:
  - host: agent.mybingo.fun
    http:
      paths:
      - path: /api
        backend:
          serviceName: agent-api
          servicePort: 80
      - path: /
        backend:
          serviceName: agent-bin
          servicePort: 80