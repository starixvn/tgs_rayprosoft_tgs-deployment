apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-agent-bin
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - agent.mybingo.fun
    secretName: agent.mybingo.fun
  rules:
  - host: agent.mybingo.fun
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: agent-api
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: agent-bin
            port:
              number: 80