apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-gmo
  namespace: prod
spec:
  ingressClassName: nginx
  rules:
  - host: agent.hkg28.com
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: agent-api
            port: 
              number: 80
      - pathType: Prefix 
        path: /
        backend:
          service:
            name: agent-gmo
            port: 
              number: 80