apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-webet
  namespace: prod
spec:
  ingressClassName: nginx
  rules:
  - host: agent.amg8.life
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: agent-api
            port: 
              number: 80
      - pathType: Prefix 
        path: /
        backend:
          service:
            name: agent-webet
            port: 
              number: 80