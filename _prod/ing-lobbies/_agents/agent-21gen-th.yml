apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-21gen-th
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - agent-th.21gen.com
    secretName: agent-th.21gen.com
  rules:
  - host: agent-th.21gen.com
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: agent-api
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: agent-21gen-th
            port:
              number: 80