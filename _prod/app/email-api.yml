apiVersion: v1
kind: ConfigMap
metadata:
  name: email-api
  namespace: prod
data:
  appsettings.json: |
    {
      "EmailSetting": {
        "FromMail": "verifyme@163.com",
        "FromName": "TGS",
        "SmtpServer": "smtp.163.com",
        "Port": 25,
        "Password": "IAUSMDLMDZWJECBP"
      },
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      },
      "AllowedHosts": "*",
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-api
  namespace: prod
  labels:
    app: email-api
spec:
  selector:
    matchLabels:
      app: email-api
  replicas: 1
  template:
    metadata:
      labels:
        app: email-api
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: email-api
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/email-api:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80  
          volumeMounts:
            - mountPath: /app/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
      volumes:
        - name: appsettings
          configMap:
            name: email-api  
---
apiVersion: v1
kind: Service
metadata: 
  name: email-api
  namespace: prod
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: email-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: email-api
  namespace: prod
spec:
  ingressClassName: nginx
  rules:
  - host: email2.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: email-api
            port: 
              number: 80          