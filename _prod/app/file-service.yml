apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: prod
  labels:
    app: file-service
spec:
  selector:
    matchLabels:
      app: file-service
  replicas: 1
  template:
    metadata:
      labels:
        app: file-service
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
        - name: file-service
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/file-service:prod-2021831-0820
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            limits:
              cpu: 750m
              memory: 756Mi
            requests:
              cpu: 250m
              memory: 256Mi
          env:
            - name: aspnetcore_environment
              value: "Production"
            - name: aspnetcore_https_port
              value: "443"
          volumeMounts:
            - mountPath: /config/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
            - mountPath: /etc/ssl/certs/rds-combined-ca-bundle.pem
              name: rds-combined-ca-bundle
              readOnly: true
              subPath: rds-combined-ca-bundle.pem
      volumes:
        - name: appsettings
          configMap:
            name: configmap-file-service
        - name: rds-combined-ca-bundle
          configMap:
            name: configmap-mongodb-pem
---
apiVersion: v1
kind: Service
metadata: 
  name: file-service
  namespace: prod
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: file-service  