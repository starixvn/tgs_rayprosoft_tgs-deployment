apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-api-mgm
  namespace: prod
  labels:
    app: op-api-mgm
spec:
  selector:
    matchLabels:
      app: op-api-mgm
  replicas: 2
  template:
    metadata:
      labels:
        app: op-api-mgm
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
        - name: op-api-mgm
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/operator-api:prod
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            failureThreshold: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: 80
            failureThreshold: 30
            periodSeconds: 2
          resources:
            limits:
              cpu: "1"
              memory: 1500Mi
            requests:
              cpu: "1"
              memory: 1500Mi
          env:
            - name: OTEL_SERVICE_NAME
              value: Operator-Api({{ .Release.Namespace }})
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: aspnetcore_environment
              value: "Production"
            - name: aspnetcore_https_port
              value: "443"
          volumeMounts:
            - mountPath: /config/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json 
        - name: monitor
          image: mcr.microsoft.com/dotnet/monitor:6.0.0
          args: [ "--no-auth" ]
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DOTNETMONITOR_DiagnosticPort__ConnectionMode
              value: Listen
            - name: DOTNETMONITOR_DiagnosticPort__EndpointName
              value: /diag/port
            - name: DOTNETMONITOR_Storage__DumpTempFolder
              value: /dumps
            - name: DOTNETMONITOR_Urls
              value: http://+:52324
            - name: DOTNETMONITOR_Metrics__Endpoints
              value: http://+:52325
            - name: XDG_CONFIG_HOME
              value: /config
          volumeMounts:
            - mountPath: /diag
              name: diagvol
            - mountPath: /dumps
              name: dumpsvol
            - mountPath: /config/dotnet-monitor/settings.json
              name: appsettings
              readOnly: true
              subPath: monitor.settings.json
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: appsettings
          configMap:
            name: configmap-operator-api
---
apiVersion: v1
kind: Service
metadata: 
  name: op-api-mgm
  namespace: prod
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: op-api-mgm                    