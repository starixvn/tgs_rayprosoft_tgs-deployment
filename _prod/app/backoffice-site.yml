kind: Deployment
apiVersion: apps/v1
metadata:
  name: backoffice-site
  namespace: prod
  labels:
    app: backoffice-site
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backoffice-site
  template:
    metadata:
      labels:
        app: backoffice-site
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
        - name: backoffice-site
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/backoffice-site:prod
          imagePullPolicy: IfNotPresent
          env:
          - name: MODE
            value: "Production"
          - name: LOGIN_BUTTON_COLOR
            value: "#ffffff"
          - name: LOGIN_BUTTON_BACKGROUND
            value: "#1e417b"
          - name: HEADER_BACKGROUND
            value: "#1e417b"
          - name: HEADER_BUTTON_COLOR
            value: "#ffffff"
          - name: HEADER_BUTTON_BACKGROUND
            value: "transparent"
          - name: LOGIN_IMAGE_URL
            value: "//images.srvptt.com/GMS%20Logo/GMS.png"
          - name: HEADER_IMAGE_URL
            value: "//images.srvptt.com/GMS%20Logo/GMS-w.png"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backoffice-site
  namespace: prod
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: backoffice-site
