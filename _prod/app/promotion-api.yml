apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-api
  namespace: prod
  labels:
    app: promotion-api
spec:
  selector:
    matchLabels:
      app: promotion-api
  replicas: 1
  template:
    metadata:
      labels:
        app: promotion-api
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
        - name: promotion-api
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/promotion-api:prod
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            limits:
              cpu: 750m
              memory: 756Mi
            requests:
              cpu: 250m
              memory: 256Mi
          env:
            - name: aspnetcore_environment
              value: "Docker"
            - name: aspnetcore_https_port
              value: "443"
          volumeMounts:
            - mountPath: /config/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
      volumes:
        - name: appsettings
          configMap:
            name: configmap-promotion-api
---
apiVersion: v1
kind: Service
metadata: 
  name: promotion-api
  namespace: prod
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: promotion-api