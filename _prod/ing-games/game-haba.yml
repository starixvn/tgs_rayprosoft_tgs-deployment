apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-haba
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 20.189.118.92/32;
      allow 20.189.115.128/32;
      allow 20.189.119.242/32;
      allow 20.189.119.246/32;
      allow 20.189.117.68/32;
      allow 220.132.206.70/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-haba.yydsgo.xyz
    secretName: game-haba.yydsgo.xyz
  rules:
  - host: game-haba.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-haba
            port:
              number: 80