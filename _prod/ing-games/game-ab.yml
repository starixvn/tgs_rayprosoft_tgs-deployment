apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-ab
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 119.9.94.103/32;
      allow 13.78.125.166/32;
      allow 3.0.91.164/32;
      allow 220.132.206.70/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-ab.yydsgo.xyz
    secretName: game-ab.yydsgo.xyz
  rules: 
  - host: game-ab.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-ab
            port:
              number: 80