apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-jdb
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 47.242.62.103/32;
      allow 220.228.136.14/32;
      allow 220.132.206.70/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-jdb.yydsgo.xyz
    secretName: game-jdb.yydsgo.xyz
  rules: 
  - host: game-jdb.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-jdb
            port:
              number: 80