apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-game-pp
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 43.240.94.128/27;
      allow 202.153.199.64/29;
      allow 195.69.223.146/32;
      allow 176.112.120.11/32;
      allow 185.8.155.162/32;
      allow 5.2.130.103/32;
      allow 84.1.113.218/32;
      allow 195.69.221.202/32;
      allow 176.112.120.12/32;
      allow 185.8.155.162/32;
      allow 81.196.86.120/32;
      allow 116.66.182.128/27;
      allow 23.106.76.128/27;
      allow 220.132.206.70/32;
      deny all;
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - game-pp.yydsgo.xyz
    secretName: game-pp.yydsgo.xyz
  rules: 
  - host: game-pp.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-pp
            port:
              number: 80