apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-game-evo
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - game-evo.yydsgo.xyz
    secretName: game-evo.yydsgo.xyz
  rules: 
  - host: game-evo.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-evo
            port:
              number: 80
