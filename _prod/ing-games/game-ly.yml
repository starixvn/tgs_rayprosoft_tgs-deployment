apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-ly
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - game-ly.yydsgo.xyz
    secretName: game-ly.yydsgo.xyz
  rules: 
  - host: game-ly.yydsgo.xyz
    http:
      paths:
      - path: /
        backend:
          serviceName: game-ly
          servicePort: 80   