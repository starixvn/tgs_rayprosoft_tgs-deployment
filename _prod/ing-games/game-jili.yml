apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-jili
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 34.126.71.71;
      allow 34.126.181.213;
      allow 35.240.213.159;
      allow 34.87.89.148;
      allow 34.87.165.104;
      deny all;
spec:
  tls:
  - hosts:
    - game-jili.yydsgo.xyz
    secretName: game-jili.yydsgo.xyz
  rules: 
  - host: game-jili.yydsgo.xyz
    http:
      paths:
      - path: /
        backend:
          serviceName: game-jili
          servicePort: 80   