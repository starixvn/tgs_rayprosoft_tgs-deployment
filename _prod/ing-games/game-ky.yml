apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-ky
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 34.92.210.164/32;
      allow 220.132.206.70/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-ky.yydsgo.xyz
    secretName: game-ky.yydsgo.xyz
  rules:
  - host: game-ky.yydsgo.xyz
    http:
      paths:
      - path: /
        backend:
          serviceName: game-ky
          servicePort: 80