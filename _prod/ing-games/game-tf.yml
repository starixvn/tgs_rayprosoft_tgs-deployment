apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-tf
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 13.251.28.37/32;
      allow 13.251.252.244/32;
      allow 18.136.114.15/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-tf.yydsgo.xyz
    secretName: game-tf.yydsgo.xyz
  rules: 
  - host: game-tf.yydsgo.xyz
    http:
      paths:
      - path: /
        backend:
          serviceName: game-tf
          servicePort: 80   