apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-ag
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 124.6.151.219/32;
      allow 216.108.249.111/32;
      allow 216.108.240.111/32;
      allow 207.174.180.111/32;
      allow 116.251.237.111/32;
      allow 45.200.112.111/32;
      allow 45.200.114.111/32;
      allow 220.132.206.70/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-ag.yydsgo.xyz
    secretName: game-ag.yydsgo.xyz
  rules: 
  - host: game-ag.yydsgo.xyz
    http:
      paths:
      - path: /
        backend:
          serviceName: game-ag
          servicePort: 80   