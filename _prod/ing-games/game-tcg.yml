apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-tcg
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 61.216.128.109/32;
      allow 123.51.167.65/32;
      allow 220.132.206.70/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-tcg.yydsgo.xyz
    secretName: game-tcg.yydsgo.xyz
  rules: 
  - host: game-tcg.yydsgo.xyz
    http:
      paths:
      - path: /
        backend:
          serviceName: game-tcg
          servicePort: 80   