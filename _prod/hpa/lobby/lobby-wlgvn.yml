apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: lobby-wlgvn
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lobby-wlgvn
  minReplicas: 2
  maxReplicas: 10
  metrics: 
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 80
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: 80