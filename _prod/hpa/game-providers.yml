apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: game-gameproviders
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-gameproviders
  minReplicas: 5
  maxReplicas: 15
  metrics: 
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 160
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: 60