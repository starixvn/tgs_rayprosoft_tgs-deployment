apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: operator-api
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: operator-api
  minReplicas: 5
  maxReplicas: 15
  metrics: 
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 500
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: 60