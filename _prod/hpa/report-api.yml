apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: report-api
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: report-api
  minReplicas: 2
  maxReplicas: 10
  metrics: 
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 800
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: 300