apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: log-api
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: log-api
  minReplicas: 2
  maxReplicas: 5
  metrics: 
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 300
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 160