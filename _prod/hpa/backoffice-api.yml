apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: backoffice-api
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backoffice-api
  minReplicas: 2
  maxReplicas: 20
  metrics: 
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 1000
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: 700