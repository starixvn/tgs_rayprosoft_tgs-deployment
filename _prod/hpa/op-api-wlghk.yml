apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: op-api-wlghk
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: op-api-wlghk
  minReplicas: 2
  maxReplicas: 10
  metrics: 
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 60
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: 60