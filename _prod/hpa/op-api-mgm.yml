apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: op-api-mgm
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: op-api-mgm
  minReplicas: 2
  maxReplicas: 10
  metrics: 
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 70
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: 70