apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-leepay
  namespace: prod
  labels:
    app: payment-leepay
spec:
  selector:
    matchLabels:
      app: payment-leepay
  replicas: 1
  template:
    metadata:
      labels:
        app: payment-leepay
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
        - name: payment-leepay
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/payment-leepay:prod
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            limits:
              cpu: 750m
              memory: 756Mi
            requests:
              cpu: 100m
              memory: 256Mi
          env:
            - name: LeePay__IsSimulation
              value: "false"
          volumeMounts:
            - mountPath: /app/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
      volumes:
        - name: appsettings
          configMap:
            name: configmap-payment
---
apiVersion: v1
kind: Service
metadata: 
  name: payment-leepay
  namespace: prod
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: payment-leepay