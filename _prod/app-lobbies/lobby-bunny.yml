kind: Deployment
apiVersion: apps/v1
metadata:
  name: lobby-bunny
  namespace: prod
  labels:
    type: lobby
    app: lobby-bunny
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-bunny
  template:
    metadata:
      labels:
        app: lobby-bunny
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
        - name: lobby-bunny
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t2:prod
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "PFgYNAnJqOpkt6zHX3FWQTvMhweGY1C6EcjmAldCVoNRErXNKgUdgT"
          - name: CURRENCY
            value: "PHP"
          - name: BRAND
            value: "BUNNY"
          - name: DEFAULT_LANGUAGE
            value: "en-US"
          - name: THEME
            value: "red"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 5m
              memory: 30Mi
            requests:
              cpu: 5m
              memory: 30Mi
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-bunny
  namespace: prod
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: lobby-bunny