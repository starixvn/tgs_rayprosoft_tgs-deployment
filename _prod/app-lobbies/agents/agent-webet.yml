kind: Deployment
apiVersion: apps/v1
metadata:
  name: agent-webet
  namespace: prod
  labels:
    type: agent
    app: agent-webet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-webet
  template:
    metadata:
      labels:
        app: agent-webet
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
        - name: agent-webet
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/agent:prod
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "YuRFoIQPv7TUY2gB3QQLgFwHq1lyzn2SusDv6N9dlIkVrMbQ6wgJN6G"
          - name: CURRENCY
            value: "THB"
          - name: SITE
            value: https://webet.ac/
          - name: BRAND
            value: "WEBET"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "th-TH"
          - name: THEME
            value: "red"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 5m
              memory: 20Mi
            requests:
              cpu: 5m
              memory: 20Mi
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-webet
  namespace: prod
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: agent-webet