kind: Deployment
apiVersion: apps/v1
metadata:
  name: agent-gpi2
  namespace: prod
  labels:
    type: agent
    app: agent-gpi2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-gpi2
  template:
    metadata:
      labels:
        app: agent-gpi2
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
        - name: agent-gpi2
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/agent:prod
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "VxSVy4C2tGgoNBq3JVzlJSghtkU3ydxAbdjxUBvZfJUJkgXRb8MM3"
          - name: CURRENCY
            value: "CNY"
          - name: BRAND
            value: "PGG"
          - name: SITE
            value: "https://gpi2.srvptt.com/"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "zh-CN"
          - name: THEME
            value: "red"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 5m
              memory: 20Mi
            requests:
              cpu: 5m
              memory: 20Mi
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-gpi2
  namespace: prod
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: agent-gpi2