kind: Deployment
apiVersion: apps/v1
metadata:
  name: lobby-landing
  namespace: prod
  labels:
    type: lobby
    app: lobby-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-landing
  template:
    metadata:
      labels:
        app: lobby-landing
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
        - name: lobby-landing
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/tgs-landing:2021-1026-0215
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "eMXLwcgqhOcUkqf6JpqLzQyG1QumaRB4oBLmYuxzJh3yrpRFXQLNzH"
          - name: CURRENCY
            value: "HKD"
          - name: BRAND
            value: "landing"
          - name: DEFAULT_LANGUAGE
            value: "zh-TW"
          - name: THEME
            value: "blue"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 150m
              memory: 300Mi
            requests:
              cpu: 150m
              memory: 300Mi
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-landing
  namespace: prod
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: lobby-landing