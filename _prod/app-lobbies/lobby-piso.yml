kind: Deployment
apiVersion: apps/v1
metadata:
  name: lobby-piso
  namespace: prod
  labels:
    type: lobby
    app: lobby-piso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-piso
  template:
    metadata:
      labels:
        app: lobby-piso
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
        - name: lobby-piso
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/lobby-t3:prod
          imagePullPolicy: IfNotPresent
          env:
          - name: CLIENT
            value: "BkL6wSH33QONCtgHd3sF0MQnQbHR7KdhOcAdfSnLoSOWV74C3NF8Ua"
          - name: CURRENCY
            value: "PHP"
          - name: BRAND
            value: "PISO"
          - name: LANGUAGES
            value: "[{\"name\":\"zh-CN\",\"label\":\"简体\"},{\"name\":\"zh-TW\",\"label\":\"繁體\"},{\"name\":\"en-US\",\"label\":\"English\"},{\"name\":\"th-TH\",\"label\":\"Thai\"}]"
          - name: DEFAULT_LANGUAGE
            value: "en-US"
          - name: THEME
            value: "black"
          - name: "WAPTEMPLATE"
            value: "3"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          - name: HOMEPAGE
            value: "[\"t3-1\",\"t3-2\",\"t3-3\"]"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 5m
              memory: 30Mi
            requests:
              cpu: 5m
              memory: 30Mi
      volumes:
        - name: site-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-piso
  namespace: prod
spec:
  ports:
    - protocol: TCP
      port: 80
      name: web
  selector:
    app: lobby-piso