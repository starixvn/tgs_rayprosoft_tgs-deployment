apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  name: jaeger
  namespace: elastic-system
spec:
  strategy: production
  storage:
    type: elasticsearch # <1>
    options:
      es:
        server-urls: http://elasticsearch-master.elastic-system:9200 # <2>
        index-prefix: tgs
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-jaeger
  namespace: observability
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules: 
  - host: jaeger2.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: jaeger-query
            port: 
              number: 80               