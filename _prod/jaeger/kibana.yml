apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-kibana
  namespace: observability
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - kibana.srvptt.com
    secretName: kibana.srvptt.com
  rules: 
  - host: kibana.srvptt.com
    http:
      paths:
      - path: /
        backend:
          service:
            name: kibana-kibana
            port: 
              number: 5601               