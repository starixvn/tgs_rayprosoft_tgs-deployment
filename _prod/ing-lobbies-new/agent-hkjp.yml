apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-agent-hkjp
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - we8889.com
    secretName: we8889.com
  rules:
  - host: we8889.com
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: agent-api
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: agent-hkjp
            port:
              number: 80