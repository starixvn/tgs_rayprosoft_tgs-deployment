apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-agent-cryptobet888
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - cryptobet888.net
    secretName: cryptobet888.net
  rules:
  - host: cryptobet888.net
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: agent-api
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: agent-cryptobet888
            port:
              number: 80