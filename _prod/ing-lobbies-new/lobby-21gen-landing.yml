apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: lobby-21gen-landing
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - 21gen.com
    secretName: 21gen.com
  - hosts:
    - www.21gen.com
    secretName: www.21gen.com
  rules:
  - host: 21gen.com
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: operator-api
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: lobby-21gen-landing
            port:
              number: 80
  - host: www.21gen.com
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: operator-api
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: lobby-21gen-landing
            port:
              number: 80