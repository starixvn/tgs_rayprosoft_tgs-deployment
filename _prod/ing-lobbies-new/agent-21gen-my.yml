apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: agent-21gen-my
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - agent-my.21gen.com
    secretName: agent-my.21gen.com
  rules:
  - host: agent-my.21gen.com
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: agent-api
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: agent-21gen-my
            port:
              number: 80