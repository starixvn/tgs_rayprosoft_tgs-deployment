apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: agent-mess8
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - agent.mess888.com
    secretName: agent.mess888.com
  rules:
  - host: agent.mess888.com
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: agent-api
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: agent-mess8
            port:
              number: 80