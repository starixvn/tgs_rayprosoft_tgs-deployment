apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-jdb
  namespace: prod
  labels:
    app: game-jdb
spec:
  selector:
    matchLabels:
      app: game-jdb
  replicas: 1
  template:
    metadata:
      labels:
        app: game-jdb
    spec:
      imagePullSecrets:
        - name: registry-credentials
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
        - name: game-jdb
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/tgs-api:prod
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 80
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            limits:
              cpu: 950m
              memory: 1.5Gi
            requests:
              cpu: 500m
              memory: 756Mi
          env:
            - name: aspnetcore_environment
              value: "Production"
            - name: aspnetcore_https_port
              value: "443"
            - name: GameProviderCode
              value: "JDB"
          volumeMounts:
            - mountPath: /app/appsettings.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json 
      volumes:
        - name: appsettings
          configMap:
            name: configmap-game-jdb
---
apiVersion: v1
kind: Service
metadata: 
  name: game-jdb
  namespace: prod
  annotations: 
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    service.beta.kubernetes.io/aws-load-balancer-internal: 0.0.0.0/0
spec: 
  ports:
    - protocol: TCP
      port: 80
      name: api
  selector:
      app: game-jdb