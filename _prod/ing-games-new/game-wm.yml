apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-game-wm
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 202.134.97.134/32;
      allow 61.222.149.230/32;              
      allow 202.134.97.141/32;
      allow 202.134.97.138/32;
      allow 202.134.97.143/32;
      allow 35.201.130.105/32;
      allow 220.132.206.70/32;
      deny all;
spec:
  tls:
  - hosts:
    - game-wm.yydsgo.xyz
    secretName: game-wm.yydsgo.xyz
  rules: 
  - host: game-wm.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-wm
            port:
              number: 80