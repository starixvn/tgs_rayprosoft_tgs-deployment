apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: game-kickplayer-receiver
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - game-kickplayer-receiver.yydsgo.xyz
    secretName: game-kickplayer-receiver.yydsgo.xyz
  rules:
  - host: game-kickplayer-receiver.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-kickplayer-receiverserver 
            port:
              number: 80