apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-tgs-operator
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - operator.srvptt.com
    secretName: operator.srvptt.com
  rules:
  - host: operator.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: operator-api
            port:
              number: 80