apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-tgs-backoffice
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
  - hosts:
    - backoffice.srvptt.com
    secretName: backoffice.srvptt.com
  - hosts:
    - bo.srvptt.com
    secretName: bo.srvptt.com
  rules:    
  - host: backoffice.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: backoffice-api
            port:
              number: 80
      - pathType: Prefix
        path: /fs
        backend:
          service:
            name: file-service
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: backoffice-site
            port:
              number: 80
  - host: bo.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: backoffice-api
            port:
              number: 80
      - pathType: Prefix
        path: /fs
        backend:
          service:
            name: file-service
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: backoffice-site
            port:
              number: 80