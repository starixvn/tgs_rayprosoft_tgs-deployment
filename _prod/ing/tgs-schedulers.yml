apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schedulers
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 220.132.206.70/32;
      deny all;
spec:
  ingressClassName: nginx
  rules: 
  - host: schedulers.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: schedulers
            port: 
              number: 80