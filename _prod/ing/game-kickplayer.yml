apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-kickplayer
  namespace: prod
spec:
  ingressClassName: nginx
  rules:
  - host: game-kickplayer.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-kickplayer-server
            port: 
              number: 80