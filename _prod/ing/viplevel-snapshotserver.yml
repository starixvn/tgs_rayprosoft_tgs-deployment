apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viplevel-snapshotserver
  namespace: prod
spec:
  ingressClassName: nginx
  rules:
  - host: viplevel-snapshotserver.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: viplevel-snapshotserver
            port: 
              number: 80