apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-gameprovider-queryserver
  namespace: prod
spec:
  tls:
  - hosts:
    - game-gameprovider-queryserver.yydsgo.xyz
    secretName: game-kickplayer-receiver.yydsgo.xyz
  rules:
  - host: game-gameprovider-queryserver.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-gameprovider-queryserver
            port: 
              number: 80