apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-record-scheduler
  namespace: prod
spec:
  ingressClassName: nginx
  rules:
  - host: game-record-scheduler.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-gamerecord-scheduler
            port: 
              number: 80