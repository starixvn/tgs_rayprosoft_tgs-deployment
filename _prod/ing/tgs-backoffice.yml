apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-tgs-backoffice
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
  - hosts:
    - backoffice.srvptt.com
    secretName: backoffice.srvptt.com
  - hosts:
    - bo.srvptt.com
    secretName: bo.srvptt.com
  rules:    
  - host: backoffice.srvptt.com
    http:
      paths:
      - path: /api
        backend:
          serviceName: backoffice-api
          servicePort: 80  
      - path: /fs
        backend:
          serviceName: file-service
          servicePort: 80  
      - path: /
        backend:
          serviceName: backoffice-site
          servicePort: 80
  - host: bo.srvptt.com
    http:
      paths:
      - path: /api
        backend:
          serviceName: backoffice-api
          servicePort: 80  
      - path: /fs
        backend:
          serviceName: file-service
          servicePort: 80  
      - path: /
        backend:
          serviceName: backoffice-site
          servicePort: 80
 