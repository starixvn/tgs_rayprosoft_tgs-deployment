apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cashservice-api
  namespace: prod
spec:
  ingressClassName: nginx
  rules:
  - host: cashservice-api.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: cashservice-api
            port: 
              number: 80