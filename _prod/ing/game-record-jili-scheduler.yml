apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamerecord-jili-scheduler
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: gamerecord-jili-scheduler.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-gamerecord-jili-scheduleservice
            port: 
              number: 80