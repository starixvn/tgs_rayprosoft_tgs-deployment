apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ingress-payment
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/server-snippet: |-
      allow 113.21.161.134/32;
      allow 203.175.169.56/32;
      allow 52.220.190.119/32;
      allow 18.140.88.85/32;
      allow 13.214.16.84/32;
      allow 61.216.128.109/32;
      allow 122.146.57.9/32;
      allow 123.51.167.64/32;
      allow 63.217.71.162/32;
      allow 220.132.206.70/32;
      allow 13.229.102.78/32;
      allow 3.112.127.0/32;
      deny all;
spec:
  tls:
  - hosts:
    - payment.yydsgo.xyz
    secretName: payment.yydsgo.xyz
  rules:
  - host: payment.yydsgo.xyz
    http:
      paths:
      - path: /leepay(/|$)(.*)
        backend:
          serviceName: payment-leepay
          servicePort: 80
      - path: /primepay(/|$)(.*)
        backend:
          serviceName: payment-primepay
          servicePort: 80
      - path: /applepay(/|$)(.*)
        backend:
          serviceName: payment-applepay
          servicePort: 80
      - path: /umpay(/|$)(.*)
        backend:
          serviceName: payment-umpay
          servicePort: 80
      - path: /maticpay(/|$)(.*)
        backend:
          serviceName: payment-maticpay  
          servicePort: 80
      - path: /help2pay(/|$)(.*)
        backend:
          serviceName: payment-help2pay
          servicePort: 80
      - path: /skypay-vn(/|$)(.*)
        backend:
          serviceName: payment-skypay
          servicePort: 80
      - path: /skypay-cn(/|$)(.*)
        backend:
          serviceName: payment-skypay
          servicePort: 81