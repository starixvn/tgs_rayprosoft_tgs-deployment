apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: game-gameproviders
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
  - hosts:
    - game-gameproviders.yydsgo.xyz
    secretName: game-gameproviders.yydsgo.xyz
  rules:
  - host: game-gameproviders.yydsgo.xyz
    http:
      paths:
      - path: /
        backend:
          serviceName: game-gameproviders
          servicePort: 80