apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-gameexternalinterface-sw-service
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: game-swtf.yydsgo.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: game-gameexternalinterface-sw-service
            port: 
              number: 80